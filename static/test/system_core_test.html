<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SystemGen Smoke Test</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
        h1 { margin-bottom: 0.25rem; }
        .subtitle { color: #555; margin-bottom: 1.5rem; }
        ul { list-style: none; padding: 0; }
        li { padding: 0.5rem 0.75rem; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
        .ok { color: #0a7a0a; }
        .fail { color: #b00020; }
        .name { font-weight: 600; }
        .details { color: #333; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 0.9rem; }
        .summary { margin-top: 1rem; font-weight: 600; }
        .muted { color: #777; font-size: 0.9rem; }
        code { background: #f6f8fa; padding: 0.1rem 0.3rem; border-radius: 4px; }
    </style>
    <script src="/static/js/system_core.js"></script>
    <script>
        async function runTests() {
            const list = document.getElementById('results');
            const summary = document.getElementById('summary');
            let passed = 0, total = 0;

            function addResult(name, ok, details) {
                total++;
                if (ok) passed++;
                const li = document.createElement('li');
                const left = document.createElement('div');
                left.innerHTML = `<span class="name">${name}</span><div class="details">${details || ''}</div>`;
                const right = document.createElement('div');
                right.innerHTML = ok ? '<span class="ok">PASS</span>' : '<span class="fail">FAIL</span>';
                li.appendChild(left);
                li.appendChild(right);
                list.appendChild(li);
            }

            // Test 1: Names asset is served
            try {
                const res = await fetch('/static/data/celestial_names.txt', { cache: 'no-cache' });
                const ok = res.ok;
                let preview = '';
                if (ok) {
                    const text = await res.text();
                    const lines = text.split(/\r?\n/).filter(Boolean);
                    preview = `status=${res.status}, lines=${lines.length}, first=[${(lines[0]||'').slice(0,24)}]`;
                } else {
                    preview = `status=${res.status}`;
                }
                addResult('Names file fetch', ok, preview);
            } catch (e) {
                addResult('Names file fetch', false, String(e));
            }

            // Test 2: SystemGen API exists
            try {
                const api = window.SystemGen || {};
                const ok = typeof api.createRng === 'function' && typeof api.loadCelestialNames === 'function' && typeof api.generateSystem === 'function';
                addResult('SystemGen API presence', ok, Object.keys(api).sort().join(', '));
            } catch (e) {
                addResult('SystemGen API presence', false, String(e));
            }

            // Test 3: RNG reproducibility
            try {
                const r1 = SystemGen.createRng('test-seed');
                const a1 = Array.from({ length: 64 }, () => r1());
                const r2 = SystemGen.createRng('test-seed');
                const a2 = Array.from({ length: 64 }, () => r2());
                const ok = JSON.stringify(a1) === JSON.stringify(a2);
                addResult('RNG deterministic with same seed', ok, ok ? `sample=${a1.slice(0,3).map(n=>n.toFixed(6)).join(', ')}` : 'arrays differ');
            } catch (e) {
                addResult('RNG deterministic with same seed', false, String(e));
            }

            // Test 4: Names loader works
            try {
                const names = await SystemGen.loadCelestialNames();
                const ok = Array.isArray(names) && names.length > 0;
                addResult('Names loader', ok, `count=${names.length}, first=[${(names[0]||'').slice(0,24)}]`);
            } catch (e) {
                addResult('Names loader', false, String(e));
            }

            // Test 5: generateSystem returns expected shape (placeholder)
            try {
                const sys = await SystemGen.generateSystem({ starColor: '#ff0', giantType: 'main', seed: 'test' });
                const ok = sys && sys.star && typeof sys.star.name === 'string' && typeof sys.star.mass === 'string' && Array.isArray(sys.planets);
                addResult('generateSystem shape', ok, ok ? `star=${sys.star.name}, type=${sys.star.type}, customColor=${sys.star.customColor}` : JSON.stringify(sys));
            } catch (e) {
                addResult('generateSystem shape', false, String(e));
            }

            summary.textContent = `${passed}/${total} tests passed`;
            summary.className = 'summary ' + (passed === total ? 'ok' : 'fail');
        }

        window.addEventListener('DOMContentLoaded', runTests);
    </script>
    
</head>
<body>
    <h1>SystemGen Smoke Test</h1>
    <div class="subtitle">Quick checks for asset loading, API presence, RNG determinism, and basic generateSystem shape.</div>
    <ul id="results"></ul>
    <div id="summary" class="summary muted">Running…</div>
    <div class="muted" style="margin-top: 1rem;">Tip: You can pass a seed via <code>?seed=your-seed</code> in the URL; SystemGen will pick it up.</div>
</body>
</html>
