<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Map - Kids at Home</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ static_file('css/main.css') }}">
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cosmic-purple': '#7C3AED',
                        'space-blue': '#2563EB',
                        'star-gold': '#D97706',
                        'nebula-pink': '#BE185D',
                        'galaxy-indigo': '#4F46E5'
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'wiggle': 'wiggle 1s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body class="h-screen flex flex-col" style="background-color: #000;">
    <!-- Navigation -->
    <nav class="relative bg-gradient-to-b from-blue-900/95 to-blue-800/95 backdrop-blur-sm z-50 flex-shrink-0">
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-3">
                <!-- Logo Section -->
                <a href="/" class="group flex items-center space-x-3 hover:scale-105 transition-transform duration-300">
                    <div class="relative">
                        <span class="text-xl">🚀</span>
                    </div>
                    <span class="text-xl font-bold text-white group-hover:text-gray-200 transition-colors duration-300">
                        Kids at Home
                    </span>
                </a>
                
                <!-- Navigation Links -->
                <div class="hidden md:flex space-x-6 items-center">
                    <a href="/" class="group flex items-center space-x-2 text-gray-300 hover:text-blue-400 transition-colors duration-300 relative">
                        <i class="fas fa-home text-lg group-hover:scale-110 transition-transform duration-300"></i>
                        <span class="font-medium">Home</span>
                        <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-400 group-hover:w-full transition-all duration-300"></div>
                    </a>
                    <a href="#games" class="group flex items-center space-x-2 text-gray-300 hover:text-purple-400 transition-colors duration-300 relative">
                        <i class="fas fa-gamepad text-lg group-hover:scale-110 transition-transform duration-300"></i>
                        <span class="font-medium">Games</span>
                        <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-purple-400 group-hover:w-full transition-all duration-300"></div>
                    </a>
                    <a href="/star_map/stats" class="group flex items-center space-x-2 text-gray-300 hover:text-cyan-400 transition-colors duration-300 relative">
                        <i class="fas fa-chart-line text-lg group-hover:scale-110 transition-transform duration-300"></i>
                        <span class="font-medium">Stats</span>
                        <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-cyan-400 group-hover:w-full transition-all duration-300"></div>
                    </a>
                    <!-- Leviathan nav button — hidden until unlocked via right-clicking the Prismatic Helix -->
                    <a id="leviathanNavBtn" href="/leviathan_map"
                       class="group flex items-center space-x-2 transition-colors duration-300 relative"
                       style="display: none; color: rgba(192,132,252,0.8);"
                       onmouseover="this.style.color='rgba(216,180,254,1)'"
                       onmouseout="this.style.color='rgba(192,132,252,0.8)'">
                        <i class="fas fa-eye text-lg group-hover:scale-110 transition-transform duration-300"></i>
                        <span class="font-medium">The Void</span>
                        <div class="absolute bottom-0 left-0 w-0 h-0.5 group-hover:w-full transition-all duration-300" style="background: rgba(168,85,247,0.8);"></div>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Star Map Canvas Area -->
    <div class="flex-1 relative w-full overflow-hidden" style="cursor: grab;">
        <!-- Header Overlay -->
        <div class="absolute top-4 left-0 right-0 z-40 pointer-events-none">
            <div class="max-w-7xl mx-auto px-4 text-center">
                <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-violet-400 to-purple-500 bg-clip-text text-transparent drop-shadow-lg">
                    Star Map
                </h1>
                <p class="text-sm md:text-base text-gray-200 drop-shadow-lg">
                    Explore our cosmic neighborhood with the Sun at the center
                </p>
            </div>
        </div>

        <!-- Star Map Container -->
        <div id="starMapContainer" class="relative w-full h-full">
            <!-- Sun at the center -->
            <div id="sun" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10 group" onclick="showSunInfo()">
                <div class="relative flex items-center justify-center">
                    <!-- Sun glow effect -->
                    <div class="absolute w-16 h-16 bg-yellow-400 rounded-full blur-xl opacity-30 animate-pulse-slow" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
                    <!-- Sun itself -->
                    <img src="{{ static_file('images/yellow-dwarf.png') }}" 
                         alt="Sun" 
                         class="relative w-16 h-16 object-contain z-10 rounded-full"
                         style="filter: drop-shadow(0 0 8px rgba(255, 255, 0, 0.8)) drop-shadow(0 0 15px rgba(255, 200, 0, 0.4)); border-radius: 50%;">
                    <!-- Sun label -->
                    <div class="absolute top-full left-1/2 transform -translate-x-1/2 mt-2 text-center opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none z-20">
                        <span class="text-white font-bold text-sm bg-gray-900/90 px-2 py-1 rounded">Sun</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Displayed Objects Count -->
        <div class="absolute top-20 right-4 z-50 pointer-events-none">
            <div class="bg-gray-900/80 backdrop-blur-sm rounded-lg p-4 border border-gray-700/50">
                <div class="flex flex-col space-y-2">
                    <div class="text-white text-sm font-bold mb-1 flex items-center space-x-2">
                        <i class="fas fa-star text-yellow-400"></i>
                        <span>Displayed Objects</span>
                    </div>
                    <div class="text-white text-2xl font-bold" id="displayedCount">0</div>
                    <div class="text-gray-400 text-xs">of <span id="totalCount">0</span> total</div>
                </div>
            </div>
        </div>

        <!-- Star Type Filters -->
        <div class="absolute top-20 left-4 z-50 pointer-events-auto max-h-[calc(100vh-8rem)] overflow-y-auto">
            <div class="bg-gray-900/80 backdrop-blur-sm rounded-lg p-4 border border-gray-700/50">
                <div class="flex flex-col space-y-3">
                    <div class="text-white text-sm font-bold mb-2 flex items-center space-x-2">
                        <i class="fas fa-filter text-gray-400"></i>
                        <span>Star Filters</span>
                    </div>
                    <!-- Quick Select Buttons -->
                    <div class="flex flex-col space-y-1 mb-2 pb-2 border-b border-gray-700">
                        <button onclick="selectAllFilters()" class="text-xs text-left px-2 py-1 rounded bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 hover:text-blue-200 transition-colors">
                            <i class="fas fa-check-double mr-1"></i> Select All
                        </button>
                        <button onclick="selectAllButFictional()" class="text-xs text-left px-2 py-1 rounded bg-green-600/20 hover:bg-green-600/40 text-green-300 hover:text-green-200 transition-colors">
                            <i class="fas fa-star mr-1"></i> Only Fictional
                        </button>
                        <button onclick="selectNoneFilters()" class="text-xs text-left px-2 py-1 rounded bg-red-600/20 hover:bg-red-600/40 text-red-300 hover:text-red-200 transition-colors">
                            <i class="fas fa-times mr-1"></i> Select None
                        </button>
                    </div>
                    <!-- Filter checkboxes -->
                    <div class="flex flex-col space-y-2 text-xs">
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="O" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #9bb0ff;"></span>
                                    <span>Blue Stars (O)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="O">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="B" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #aabfff;"></span>
                                    <span>Blue-White (B)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="B">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="A" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #cad7ff;"></span>
                                    <span>White Stars (A)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="A">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="F" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #f8f7ff;"></span>
                                    <span>Yellow-White (F)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="F">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="G" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #fff4ea;"></span>
                                    <span>Yellow Dwarfs (G)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="G">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="K" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #ffd2a1;"></span>
                                    <span>Orange Dwarfs (K)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="K">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="M" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #ffcc6f;"></span>
                                    <span>Red Dwarfs (M)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="M">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="D" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #ffffff;"></span>
                                    <span>White Dwarfs (D)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="D">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="L" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #ff8800;"></span>
                                    <span>Brown Dwarfs (L)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="L">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="T" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #cc6600;"></span>
                                    <span>Brown Dwarfs (T)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="T">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="Y" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #994400;"></span>
                                    <span>Brown Dwarfs (Y)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="Y">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="PSR" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #00ffff;"></span>
                                    <span>Pulsars (PSR)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="PSR">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="SMBH" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #000000; border: 1px solid #444;"></span>
                                    <span>Black Holes (SMBH)</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="SMBH">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="QUASAR" checked>
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #ff00ff;"></span>
                                    <span>Quasars</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="QUASAR">0</span>
                        </label>
                        <label class="flex items-center justify-between text-white cursor-pointer hover:text-blue-400 transition-colors">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" class="star-type-filter" data-type="FICTIONAL">
                                <span class="flex items-center space-x-1">
                                    <span class="w-3 h-3 rounded-full" style="background-color: #d946ef; border: 1px solid #a855f7;"></span>
                                    <span>Fictional Objects</span>
                                </span>
                            </div>
                            <span class="text-gray-400 ml-2" data-count-type="FICTIONAL">0</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Zoom Control -->
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-50 pointer-events-auto">
            <div class="bg-gray-900/80 backdrop-blur-sm rounded-lg p-4 border border-gray-700/50">
                <div class="flex flex-col space-y-3">
                    <div class="text-white text-xs font-medium mb-1">Zoom Control</div>
                    <!-- Zoom slider -->
                    <div class="flex items-center space-x-3">
                        <i class="fas fa-search-minus text-gray-400 text-sm"></i>
                        <input 
                            type="range" 
                            id="zoomSlider" 
                            min="0" 
                            max="100" 
                            value="0" 
                            step="0.1"
                            class="flex-1 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer slider"
                            style="width: 200px; background: linear-gradient(to right, rgba(147, 197, 253, 0.3) 0%, rgba(147, 197, 253, 0.3) 100%);"
                        />
                        <i class="fas fa-search-plus text-gray-400 text-sm"></i>
                    </div>
                    <!-- Zoom value display -->
                    <div class="text-white text-xs text-center" id="zoomValueDisplay">25 ly</div>
                </div>
            </div>
        </div>

        <!-- Distance Scale -->
        <div class="absolute bottom-4 left-4 z-50 pointer-events-none">
            <div class="bg-gray-900/80 backdrop-blur-sm rounded-lg p-4 border border-gray-700/50">
                <div class="flex flex-col space-y-2">
                    <div class="text-white text-xs font-medium mb-2">Distance Scale</div>
                    <!-- Scale bar -->
                    <div class="relative" id="distanceScaleBar" style="width: 200px; height: 4px; background: rgba(147, 197, 253, 0.3); border-radius: 2px;">
                        <div class="absolute inset-0" style="border-top: 2px solid rgba(147, 197, 253, 0.8);"></div>
                        <div class="absolute right-0 top-0 bottom-0" style="width: 2px; background: rgba(147, 197, 253, 0.8);"></div>
                    </div>
                    <!-- Scale label -->
                    <div class="text-white text-xs" id="distanceScaleLabel">10 light years</div>
                    <!-- Zoom level indicator -->
                    <div class="text-gray-400 text-xs mt-2" id="zoomLevelIndicator">Zoom: Scroll to adjust</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="{{ static_file('js/star_map.js') }}"></script>

    <!-- Custom Animations -->
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        @keyframes wiggle {
            0%, 7% { transform: rotateZ(0); }
            15% { transform: rotateZ(-15deg); }
            20% { transform: rotateZ(10deg); }
            25% { transform: rotateZ(-10deg); }
            30% { transform: rotateZ(6deg); }
            35% { transform: rotateZ(-4deg); }
            40%, 100% { transform: rotateZ(0); }
        }
        
        /* Star element styles */
        .star-element {
            transition: transform 0.2s ease;
        }
        
        .star-element:hover {
            transform: translate(-50%, -50%) scale(1.5);
        }
        
        #sun {
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        #sun:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        /* Slider styles */
        .slider {
            -webkit-appearance: none;
            appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(147, 197, 253, 0.9);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 4px rgba(147, 197, 253, 0.6);
            transition: all 0.2s ease;
        }
        
        .slider::-webkit-slider-thumb:hover {
            background: rgba(147, 197, 253, 1);
            box-shadow: 0 0 8px rgba(147, 197, 253, 0.8);
            transform: scale(1.1);
        }
        
        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(147, 197, 253, 0.9);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 4px rgba(147, 197, 253, 0.6);
            transition: all 0.2s ease;
        }
        
        .slider::-moz-range-thumb:hover {
            background: rgba(147, 197, 253, 1);
            box-shadow: 0 0 8px rgba(147, 197, 253, 0.8);
            transform: scale(1.1);
        }
        
        /* Custom checkbox styles */
        .star-type-filter {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: rgba(147, 197, 253, 0.8);
            border-radius: 4px;
        }
        
        .star-type-filter:checked {
            accent-color: rgba(147, 197, 253, 1);
        }
        
        .star-type-filter:hover {
            accent-color: rgba(147, 197, 253, 1);
        }
    </style>
</body>
</html>
