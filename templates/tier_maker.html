<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier Maker - Kids at Home</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ static_file('css/main.css') }}">
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cosmic-purple': '#7C3AED',
                        'space-blue': '#2563EB',
                        'star-gold': '#D97706',
                        'nebula-pink': '#BE185D',
                        'galaxy-indigo': '#4F46E5'
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'wiggle': 'wiggle 1s ease-in-out infinite',
                        'bounce-slow': 'bounce 2s infinite',
                        'spin-slow': 'spin 3s linear infinite',
                        'shake': 'shake 0.5s infinite',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        @keyframes wiggle {
            0%, 7% { transform: rotateZ(0); }
            15% { transform: rotateZ(-15deg); }
            20% { transform: rotateZ(10deg); }
            25% { transform: rotateZ(-10deg); }
            30% { transform: rotateZ(6deg); }
            35% { transform: rotateZ(-4deg); }
            40%, 100% { transform: rotateZ(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            75% { transform: translateX(5px) rotate(2deg); }
        }
        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        .rainbow-text {
            animation: rainbow 3s linear infinite;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        .draggable-item {
            cursor: grab;
            user-select: none;
        }
        .draggable-item:active {
            cursor: grabbing;
        }
        .draggable-item.dragging {
            opacity: 0.5;
            transform: rotate(5deg);
        }
        .drop-zone {
            transition: all 0.3s ease;
        }
        .drop-zone.drag-over {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .tier-label {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-900 h-screen overflow-hidden relative">
    <!-- Crazy Border Effects -->
    <div class="absolute inset-0 pointer-events-none z-50">
        <!-- Top Border -->
        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-purple-600 via-pink-600 to-blue-600 animate-pulse"></div>
        <!-- Bottom Border -->
        <div class="absolute bottom-0 left-0 right-0 h-2 bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 animate-pulse"></div>
        <!-- Left Border -->
        <div class="absolute top-0 bottom-0 left-0 w-2 bg-gradient-to-b from-yellow-600 via-orange-600 to-red-600 animate-pulse"></div>
        <!-- Right Border -->
        <div class="absolute top-0 bottom-0 right-0 w-2 bg-gradient-to-b from-cyan-600 via-blue-600 to-indigo-600 animate-pulse"></div>
        <!-- Corner Decorations -->
        <div class="absolute top-2 left-2 text-2xl animate-wiggle">6</div>
        <div class="absolute top-2 right-2 text-2xl animate-wiggle" style="animation-delay: 0.1s">7</div>
    </div>

    <!-- Minimal Header -->
    <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-40">
        <h1 class="text-3xl font-black rainbow-text bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-500 bg-clip-text text-transparent">
            TIER MAKER 🔥
        </h1>
    </div>

    <!-- Main Content Container - Full viewport with sidebar -->
    <div class="h-full pt-16 flex">
        <!-- Main Tier List Container -->
        <div class="flex-1 px-4 flex flex-col">
            <div class="flex-1 grid grid-rows-6 gap-1">
            <!-- S Tier -->
            <div class="flex border-4 border-yellow-400/50 shadow-2xl drop-zone relative overflow-hidden">
                <!-- Tier Label (Left) -->
                <div class="tier-label bg-red-600 w-20 flex-shrink-0 border-r-4 border-yellow-400/50 relative">
                    <span class="text-5xl">S</span>
                    <span class="text-xs mt-1 text-center px-1">ABSOLUTE BANGERS 🔥</span>
                    <!-- Meme border effect -->
                    <div class="absolute inset-0 border-2 border-yellow-300/30 animate-pulse"></div>
                </div>
                <!-- Drop Zone (Middle) -->
                <div id="s-tier" class="flex-1 bg-gray-800 flex flex-wrap gap-2 p-2 items-center content-center min-h-0 overflow-y-auto">
                    <!-- Items will be added here -->
                </div>
            </div>

            <!-- A Tier -->
            <div class="flex border-4 border-green-400/50 shadow-2xl drop-zone relative overflow-hidden">
                <!-- Tier Label (Left) -->
                <div class="tier-label bg-orange-500 w-20 flex-shrink-0 border-r-4 border-green-400/50 relative">
                    <span class="text-5xl">A</span>
                    <span class="text-xs mt-1 text-center px-1">SOLID CHOICES 👌</span>
                    <div class="absolute inset-0 border-2 border-green-300/30 animate-pulse"></div>
                </div>
                <!-- Drop Zone (Middle) -->
                <div id="a-tier" class="flex-1 bg-gray-800 flex flex-wrap gap-2 p-2 items-center content-center min-h-0 overflow-y-auto">
                    <!-- Items will be added here -->

            </div>

            <!-- B Tier -->
            <div class="flex border-4 border-blue-400/50 shadow-2xl drop-zone relative overflow-hidden">
                <!-- Tier Label (Left) -->
                <div class="tier-label bg-yellow-500 w-20 flex-shrink-0 border-r-4 border-blue-400/50 relative">
                    <span class="text-5xl">B</span>
                    <span class="text-xs mt-1 text-center px-1">DECENT I GUESS 🤷</span>
                    <div class="absolute inset-0 border-2 border-blue-300/30 animate-pulse"></div>
                </div>
                <!-- Drop Zone (Middle) -->
                <div id="b-tier" class="flex-1 bg-gray-800 flex flex-wrap gap-2 p-2 items-center content-center min-h-0 overflow-y-auto">
                    <!-- Items will be added here -->
                </div>
            </div>

            <!-- C Tier -->
            <div class="flex border-4 border-orange-400/50 shadow-2xl drop-zone relative overflow-hidden">
                <!-- Tier Label (Left) -->
                <div class="tier-label bg-yellow-300 w-20 flex-shrink-0 border-r-4 border-orange-400/50 relative">

                    <span class="text-xs mt-1 text-center px-1 text-gray-900">MID AF 😐</span>
                    <div class="absolute inset-0 border-2 border-orange-300/30 animate-pulse"></div>
                </div>
                <!-- Drop Zone (Middle) -->
                <div id="c-tier" class="flex-1 bg-gray-800 flex flex-wrap gap-2 p-2 items-center content-center min-h-0 overflow-y-auto">
                    <!-- Items will be added here -->
                </div>
            </div>

            <!-- D Tier -->
            <div class="flex border-4 border-red-400/50 shadow-2xl drop-zone relative overflow-hidden">
                <!-- Tier Label (Left) -->
                <div class="tier-label bg-green-400 w-20 flex-shrink-0 border-r-4 border-red-400/50 relative">
                    <span class="text-5xl text-gray-900">D</span>
                    <span class="text-xs mt-1 text-center px-1 text-gray-900">NAH BRUH 💀</span>
                    <div class="absolute inset-0 border-2 border-red-300/30 animate-pulse"></div>
                </div>
                <!-- Drop Zone (Middle) -->
                <div id="d-tier" class="flex-1 bg-gray-800 flex flex-wrap gap-2 p-2 items-center content-center min-h-0 overflow-y-auto">
                    <!-- Items will be added here -->
                </div>
            </div>

            <!-- F Tier -->
            <div class="flex border-4 border-gray-400/50 shadow-2xl drop-zone relative overflow-hidden">
                <!-- Tier Label (Left) -->
                <div class="tier-label bg-gray-600 w-20 flex-shrink-0 border-r-4 border-gray-400/50 relative">
                    <span class="text-5xl">F</span>
                    <span class="text-xs mt-1 text-center px-1">BIG L 🚫</span>
                    <div class="absolute inset-0 border-2 border-gray-300/30 animate-pulse"></div>
                </div>
                <!-- Drop Zone (Middle) -->
                <div id="f-tier" class="flex-1 bg-gray-800 flex flex-wrap gap-2 p-2 items-center content-center min-h-0 overflow-y-auto">
                    <!-- Items will be added here -->
                </div>
            </div>
        </div>
        </div>

        <!-- Item Explorer Sidebar -->
        <div class="w-80 bg-gray-800/95 backdrop-blur-sm border-l-4 border-purple-500/50 flex flex-col z-30">
            <!-- Sidebar Header -->
            <div class="px-4 py-3 border-b-2 border-purple-500/30 bg-gray-900/50">
                <h2 class="text-xl font-bold text-white rainbow-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 bg-clip-text text-transparent mb-3">
                    <i class="fas fa-box mr-2"></i>Item Explorer
                </h2>
                <div class="w-full p-[1px] bg-gradient-to-r from-cyan-400 via-blue-500 to-pink-500 rounded-full hover:shadow-[0_0_15px_rgba(139,92,246,0.5)] transition-all group">
                    <button onclick="addNewItem()" class="w-full px-4 py-3 bg-gray-950 text-gray-100 font-medium rounded-full transition-all relative overflow-hidden flex items-center justify-center gap-2">
                        <span class="text-sm">✨</span>
                        <span>Add New Item</span>
                    </button>
                </div>
            </div>
            
            <!-- Scrollable Item Container -->
            <div id="item-explorer" class="flex-1 overflow-y-auto p-4">
                <!-- Items will be added here -->
            </div>
        </div>
    </div>

    <script>
        let draggedElement = null;

        // Initialize draggable items
        document.addEventListener('DOMContentLoaded', function() {
            const draggableItems = document.querySelectorAll('.draggable-item');
            const dropZones = document.querySelectorAll('.drop-zone');

            // Make items draggable
            draggableItems.forEach(item => {
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragend', handleDragEnd);
            });

            // Setup drop zones
            dropZones.forEach(zone => {
                zone.addEventListener('dragover', handleDragOver);
                zone.addEventListener('drop', handleDrop);
                zone.addEventListener('dragenter', handleDragEnter);
                zone.addEventListener('dragleave', handleDragLeave);
            });
        });

        function handleDragStart(e) {
            draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            if (e.currentTarget.classList.contains('drop-zone')) {
                e.currentTarget.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            if (e.currentTarget.classList.contains('drop-zone')) {
                e.currentTarget.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            if (draggedElement && draggedElement !== this) {
                const dropZone = e.currentTarget.querySelector('div[id$="-tier"]');
                if (dropZone) {
                    // Remove from original location if it's in a tier
                    if (draggedElement.parentElement.id && draggedElement.parentElement.id.endsWith('-tier')) {
                        // Already in a tier, just move it
                    } else {
                        // Coming from item pool, clone it
                        draggedElement = draggedElement.cloneNode(true);
                        draggedElement.addEventListener('dragstart', handleDragStart);
                        draggedElement.addEventListener('dragend', handleDragEnd);
                    }
                    dropZone.appendChild(draggedElement);
                    
                    // Add fun animation
                    draggedElement.style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        draggedElement.style.transform = 'scale(1)';
                    }, 200);
                }
            }

            // Remove drag-over class
            this.classList.remove('drag-over');
            return false;
        }

        function addNewItem() {
            // Placeholder for adding new items
            console.log('Add new item clicked');
        }

    </script>
</body>
</html>
