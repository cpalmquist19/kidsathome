<!DOCTYPE html>
<html>
<head>
    <title>Space Growth Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Main game variables
        let scene, camera, renderer;
        let player;

        function createSkybox() {
            const loader = new THREE.CubeTextureLoader();
            loader.setPath('/static/skybox/');

            loader.load([
                'right.png',
                'left.png',
                'up.png',
                'down.png',
                'front.png',
                'back.png'
            ],
            // Success callback
            function(texture) {
                scene.background = texture;
                console.log('Skybox loaded successfully');
            },
            // Progress callback
            undefined,
            // Error callback
            function(err) {
                console.error('Error loading skybox:', err);
            });
        }

        function init() {
            // Create scene
            scene = new THREE.Scene();

            // Setup camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 5, 10);

            // Setup renderer
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Create skybox
            createSkybox();

            // Create initial player (dust particle)
            const geometry = new THREE.SphereGeometry(0.5, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: 0xcccccc });
            player = new THREE.Mesh(geometry, material);
            scene.add(player);

            // Add keyboard controls for player movement
            document.addEventListener('keydown', onKeyDown);

            // Handle window resizing
            window.addEventListener('resize', onWindowResize, false);

            // Start animation loop
            animate();
        }

        // Add player movement function
        function onKeyDown(event) {
            const moveSpeed = 0.5;
            switch(event.key) {
                case 'ArrowUp':
                case 'w':
                    player.position.z -= moveSpeed;
                    break;
                case 'ArrowDown':
                case 's':
                    player.position.z += moveSpeed;
                    break;
                case 'ArrowLeft':
                case 'a':
                    player.position.x -= moveSpeed;
                    break;
                case 'ArrowRight':
                case 'd':
                    player.position.x += moveSpeed;
                    break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Update camera position to follow player
            const cameraOffset = new THREE.Vector3(0, 5, 10); // Height of 5, 10 units behind
            camera.position.copy(player.position).add(cameraOffset);
            camera.lookAt(player.position);

            renderer.render(scene, camera);
        }

        // Start the game
        init();
    </script>
</body>
</html>
