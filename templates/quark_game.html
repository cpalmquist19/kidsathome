                push = Math.min(1, Math.hypot(ix, iy));
                if (push < 0.12) { ix = iy = 0; } // small dead zone in the middle
            }
            // Running (Shift / RUN button) is turned off for now. To bring it back,
            // swap these two lines (and uncomment the RUN button code above).
            // const running = keys.has('shift') || touchRun;
            const running = false;
            const speedScale = (running ? RUN_BOOST : 1) / camera.zoom;
            const maxSpeed = PLAYER.maxSpeed * speedScale * Math.max(push, 0.35);
            if (playerOrbit) {
                // You're orbiting something: WASD does nothing until you let go
            } else if (ix || iy) {
                const len = Math.hypot(ix, iy);
                player.vx += (ix / len) * PLAYER.accel * speedScale * push * dt;
                player.vy += (iy / len) * PLAYER.accel * speedScale * push * dt;
            } else {
                const f = Math.exp(-PLAYER.friction * dt);
                player.vx *= f;
                player.vy *= f;
            }

            // --- Gluon bonds act like springs ---
            const K = 60, DAMP = 8;
            for (const [a, b] of bonds) {
                const dx = b.x - a.x, dy = b.y - a.y;
                const d = Math.hypot(dx, dy) || 0.001;
                const nx = dx / d, ny = dy / d;
                const stretch = d - restLength(a, b);
                const relV = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
                const f = (K * stretch + DAMP * relV) * dt;
                const wa = a.isPlayer ? 0.35 : 1;  // player is steered, so it's pulled less
                a.vx += nx * f * wa; a.vy += ny * f * wa;
                b.vx -= nx * f;      b.vy -= ny * f;
            }

            // Atoms in a molecule that aren't bonded push each other away,
            // which spreads the molecule into its shape
            if (stage === 'molecule') {
                for (let i = 0; i < cluster.length; i++) {
                    for (let j = i + 1; j < cluster.length; j++) {
                        if (bondedPairs.has(i * 1000 + j)) continue;
                        const a = cluster[i], b = cluster[j];
                        const dx = b.x - a.x, dy = b.y - a.y;
                        const D = (a.r + b.r) * 1.9;
                        if (Math.abs(dx) > D || Math.abs(dy) > D) continue;
                        const d = Math.hypot(dx, dy) || 0.001;
                        if (d >= D) continue;
                        const f = (D - d) * 25 * dt / d;
                        const wa = a.isPlayer ? 0.35 : 1;
                        a.vx -= dx * f * wa; a.vy -= dy * f * wa;
                        b.vx += dx * f;      b.vy += dy * f;
                    }
                }
            }

            // Bound quarks shouldn't overlap each other
            for (let i = 0; i < cluster.length; i++) {
                for (let j = i + 1; j < cluster.length; j++) {
                    const a = cluster[i], b = cluster[j];
                    let dx = b.x - a.x, dy = b.y - a.y;
                    if (Math.abs(dx) + Math.abs(dy) < 0.01) { dx = rand(-1, 1); dy = rand(-1, 1); } // exactly stacked: pick a direction
                    const d = Math.hypot(dx, dy) || 0.001;
                    const min = a.r + b.r + 6;
                    if (d < min) {
                        const push = (min - d) / 2, nx = dx / d, ny = dy / d;
                        a.x -= nx * push; a.y -= ny * push;
                        b.x += nx * push; b.y += ny * push;
                    }
                }
            }

            // Followers drift to a stop when nothing pulls them, and can never
            // go wildly faster than you (keeps a stretched bond from flinging them)
            const followerDrag = Math.exp(-1.5 * dt);
            const followerMax = maxSpeed * 2.5;
            for (const q of cluster) {
                if (q.isPlayer) continue;
                q.vx *= followerDrag; q.vy *= followerDrag;
                const s = Math.hypot(q.vx, q.vy);
                if (s > followerMax) { q.vx *= followerMax / s; q.vy *= followerMax / s; }
            }

            // Player speed cap
            const speed = Math.hypot(player.vx, player.vy);
            if (speed > maxSpeed) {
                player.vx *= maxSpeed / speed;
                player.vy *= maxSpeed / speed;
            }

            for (const q of cluster) {
                q.x += q.vx * dt;
                q.y += q.vy * dt;
                keepInWorld(q);
            }
            if (playerOrbit) orbitAroundTarget(dt);
            if (player.spin !== undefined) player.spin += player.spinSpeed * dt;

            if (forming) {
                forming.timer -= dt;
                if (forming.timer <= 0) formHadron();
            }

            // --- Free particles drift ---
            // A positive nucleus or ion pulls nearby electrons toward it
            const pullsElectrons = stage !== 'molecule' && player.atom && player.atom.E < player.atom.Z;
            const pullRange = player.r + 220;
            const bounds = clusterBounds();
            for (const p of free) {
                if (p.orbit) { // right-clicked: circles around you
                    const o = p.orbit;
                    const dist = orbitDistance(p, bounds);
                    o.angle += (o.speed / dist) * o.dir * dt;
                    p.x = bounds.cx + Math.cos(o.angle) * dist;
                    p.y = bounds.cy + Math.sin(o.angle) * dist;
                    // remember the circling speed, for if you let it go
                    p.vx = -Math.sin(o.angle) * o.speed * o.dir + player.vx;
                    p.vy = Math.cos(o.angle) * o.speed * o.dir + player.vy;
                    if (p.spin !== undefined) p.spin += p.spinSpeed * dt;
                    if (p.rot !== undefined) p.rot += p.rotSpeed * dt;
                    continue;
                }
                if (pullsElectrons && p.type.id === 'electron') {
                    const dx = player.x - p.x, dy = player.y - p.y;
                    const d = Math.hypot(dx, dy);
                    if (d < pullRange && d > 0.001) {
                        p.vx += (dx / d) * 500 * dt;
                        p.vy += (dy / d) * 500 * dt;
                    }
                }
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                if (p.spin !== undefined) p.spin += p.spinSpeed * dt;
                if (p.rot !== undefined) p.rot += p.rotSpeed * dt;
                keepInWorld(p);
            }

            // --- Collisions between the player's group and free particles ---
            for (let i = free.length - 1; i >= 0; i--) {
                const p = free[i];
                if (!p) continue; // the list shrank (e.g. subatomic particles vanished on entering molecule scale)
                if (p.orbit) continue; // orbiting things never touch you
                if (playerOrbit && p === playerOrbit.target) continue; // nor does what you orbit
                const near = bounds.extent + p.r;
                if (Math.abs(p.x - bounds.cx) > near || Math.abs(p.y - bounds.cy) > near) continue;
                if (p.chem) { chemContact(p); continue; }
                for (const c of cluster) {
                    const dx = p.x - c.x, dy = p.y - c.y;
                    const reach = p.r + c.r;
                    if (Math.abs(dx) > reach || Math.abs(dy) > reach) continue;
                    const d = Math.hypot(dx, dy) || 0.001;
                    if (d >= reach) continue;

                    if (isQuarkKind(p.type)) {
                        const check = canJoin(p);
                        if (check.ok) {
                            joinCluster(p, c);
                            break;
                        }
                        if (check.reason) floatText(p, check.reason);
                    } else if (c === player) {
                        const check = canAbsorb(p);
                        if (check && check.ok) {
                            absorb(p);
                            break;
                        }
                        if (check && check.reason) floatText(p, check.reason);
                    }

                    // Everything else (and quarks that don't fit) just bumps
                    const nx = dx / d, ny = dy / d, overlap = reach - d;
                    const total = p.mass + c.mass;
                    p.x += nx * overlap * (c.mass / total);
                    p.y += ny * overlap * (c.mass / total);
                    c.x -= nx * overlap * (p.mass / total);
                    c.y -= ny * overlap * (p.mass / total);
                    const vn = (p.vx - c.vx) * nx + (p.vy - c.vy) * ny;
                    if (vn < 0) {
                        const j = -1.5 * vn / (1 / p.mass + 1 / c.mass);
                        p.vx += (j / p.mass) * nx; p.vy += (j / p.mass) * ny;
                        c.vx -= (j / c.mass) * nx; c.vy -= (j / c.mass) * ny;
                    }
                }
            }

            // --- Camera follows the player (the middle of your molecule) ---
            let focus = stage === 'molecule' ? clusterBounds() : { cx: player.x, cy: player.y, extent: Math.max(player.r, bounds.extent) };
            if (playerOrbit) {
                // While orbiting, hold the camera on what you're orbiting so
                // the view stays steady and you circle around the middle
                const t = playerOrbit.target;
                focus = { cx: t.x, cy: t.y, extent: playerOrbitDistance(bounds) + bounds.extent };
            }
            const t = 1 - Math.exp(-camera.follow * dt);
            camera.x += (focus.cx - camera.x) * t;
            camera.y += (focus.cy - camera.y) * t;

            // Atoms are shown at full size (only zooming out if one won't fit).
            // Molecules are zoomed out so they look as big as your atom did.
            const screen = Math.min(window.innerWidth, window.innerHeight);
            const autoZoom = stage === 'molecule'
                ? Math.max(0.02, Math.min(1, moleculeScreenR / focus.extent))
                : Math.min(1, screen * 0.35 / focus.extent);
            // The scroll wheel scales the automatic zoom up or down
            const targetZoom = Math.max(0.002, Math.min(8, autoZoom * userZoom));
            camera.zoom += (targetZoom - camera.zoom) * (1 - Math.exp(-5 * dt));
        }

        // =====================================================================
        // Drawing helpers
        // =====================================================================
        function drawBall(x, y, r, look, alpha = 1) {
            const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
            g.addColorStop(0, look.light);
            g.addColorStop(0.45, look.base);
            g.addColorStop(1, look.dark);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        function drawLabel(text, x, y, size, bar, serif) {
            ctx.font = `${serif ? 'italic bold' : 'bold'} ${size}px ${serif ? 'Georgia, "Times New Roman", serif' : 'system-ui, sans-serif'}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineJoin = 'round';
            ctx.lineWidth = Math.max(2, size * 0.14);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.strokeText(text, x, y);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, x, y);
            if (bar) {
                const w = ctx.measureText(text).width;
                const by = y - size * 0.55;
                ctx.lineCap = 'round';
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
                ctx.beginPath(); ctx.moveTo(x - w / 2, by); ctx.lineTo(x + w / 2, by); ctx.stroke();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(1, size * 0.08);
                ctx.beginPath(); ctx.moveTo(x - w / 2, by); ctx.lineTo(x + w / 2, by); ctx.stroke();
            }
        }

        function drawQuark(x, y, r, color, sym, bar) {
            drawBall(x, y, r, COLOR_CHARGE[color]);
            if (r >= 5) drawLabel(sym, x, y + r * 0.05, r * 1.2, bar, true);
        }

        // Wavy gluon line between two balls, like a spring
        function drawGluon(ax, ay, ar, bx, by, br, time, width) {
            const dx = bx - ax, dy = by - ay;
            const d = Math.hypot(dx, dy);
            if (d < ar + br + 2) return;
            const nx = dx / d, ny = dy / d;
            const px = -ny, py = nx;
            const start = ar * 0.85, end = d - br * 0.85;
            const len = end - start;
            const waves = Math.max(2, Math.round(len / (width * 3.2)));
            const amp = width * 1.3;
            const phase = time / 120;

            ctx.beginPath();
            for (let s = 0; s <= len; s += 1.5) {
                const off = Math.sin((s / len) * waves * Math.PI * 2 - phase) * amp;
                const x = ax + nx * (start + s) + px * off;
                const y = ay + ny * (start + s) + py * off;
                if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#a8963a';
            ctx.lineWidth = width + 1.5;
            ctx.stroke();
            ctx.strokeStyle = '#fff4a8';
            ctx.lineWidth = width;
            ctx.stroke();
        }

        function drawHadron(p, time) {
            // Gray "bag" holding its quarks, like the proton picture
            const g = ctx.createRadialGradient(p.x, p.y, p.r * 0.2, p.x, p.y, p.r);
            g.addColorStop(0, 'rgba(190, 190, 200, 0.55)');
            g.addColorStop(1, 'rgba(120, 120, 135, 0.35)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(220, 220, 235, 0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();

            const n = p.inner.length;
            const qr = p.r * (n === 3 ? 0.3 : 0.34);
            const dist = p.r * (n === 3 ? 0.5 : 0.48);
            const pts = p.inner.map((q, i) => {
                const a = p.spin + (i / n) * Math.PI * 2 - Math.PI / 2;
                return { x: p.x + Math.cos(a) * dist, y: p.y + Math.sin(a) * dist, q };
            });
            for (let i = 0; i < n; i++) {
                for (let j = i + 1; j < n; j++) {
                    drawGluon(pts[i].x, pts[i].y, qr, pts[j].x, pts[j].y, qr, time, Math.max(1, qr * 0.18));
                }
            }
            for (const pt of pts) drawQuark(pt.x, pt.y, qr, pt.q.color, pt.q.sym, pt.q.anti);

            drawLabel(p.type.sym, p.x, p.y + p.r + 10, 12, p.type.bar, false);
        }

        function drawSimple(p, time) {
            const look = p.type.look;
            if (p.type.neutrino || p.type.fast) {
                // Tiny particles get a soft glow so they're visible
                const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
                glow.addColorStop(0, look.base + '88');
                glow.addColorStop(1, look.base + '00');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
                ctx.fill();
            }
            drawBall(p.x, p.y, p.r, look);
            if (p.r >= 14) {
                drawLabel(p.type.sym, p.x, p.y, Math.min(p.r * 0.85, 34), p.type.bar, false);
            } else {
                ctx.globalAlpha = 0.75;
                drawLabel(p.type.sym, p.x + p.r + 9, p.y - p.r - 4, 10, p.type.bar, false);
                ctx.globalAlpha = 1;
            }
        }

        function drawAlpha(p) {
            const nr = p.r * 0.42;
            for (let i = 0; i < 4; i++) {
                const a = p.spin + i * Math.PI / 2;
                const x = p.x + Math.cos(a) * nr * 0.75, y = p.y + Math.sin(a) * nr * 0.75;
                drawBall(x, y, nr, i % 2 ? NEUTRON_LOOK : PROTON_LOOK);
            }
            drawLabel('α', p.x, p.y + p.r + 8, 12, false, false);
        }

        function drawFree(p, time) {
            if (p.chem) drawMolecule(p);
            else if (p.type.kind === 'nucleus') drawAlpha(p);
            else if (p.type.kind === 'atom') drawAtom(p, time);
            else if (isQuarkKind(p.type)) drawQuark(p.x, p.y, p.r, p.color, p.type.sym, p.type.bar);
            else if (p.type.kind === 'hadron') drawHadron(p, time);
            else drawSimple(p, time);
        }

        // =====================================================================
        // Background texture (one tile, repeated across the world)
        // =====================================================================
        const TILE = 512;
        function makeBackgroundTile() {
            const tile = document.createElement('canvas');
            tile.width = TILE;
            tile.height = TILE;
            const t = tile.getContext('2d');
            t.fillStyle = '#0a0c18';
            t.fillRect(0, 0, TILE, TILE);

            let seed = 1337;
            const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

            for (let i = 0; i < 14; i++) {
                const x = srand() * TILE, y = srand() * TILE, r = 40 + srand() * 90;
                const g = t.createRadialGradient(x, y, 0, x, y, r);
                const hue = 220 + srand() * 60;
                g.addColorStop(0, `hsla(${hue}, 50%, 25%, 0.18)`);
                g.addColorStop(1, `hsla(${hue}, 50%, 25%, 0)`);
                t.fillStyle = g;
                for (const ox of [-TILE, 0, TILE]) {
                    for (const oy of [-TILE, 0, TILE]) {
                        t.beginPath();
                        t.arc(x + ox, y + oy, r, 0, Math.PI * 2);
                        t.fill();
                    }
                }
            }
            for (let i = 0; i < 260; i++) {
                const x = srand() * TILE, y = srand() * TILE;
                const s = srand() < 0.9 ? 1 : 2;
                t.fillStyle = `rgba(180, 190, 255, ${0.08 + srand() * 0.25})`;
                t.fillRect(x, y, s, s);
            }
            t.strokeStyle = 'rgba(120, 140, 255, 0.07)';
            t.lineWidth = 1;
            const stepPx = TILE / 4;
            for (let i = 0; i <= TILE; i += stepPx) {
                t.beginPath();
                t.moveTo(i + 0.5, 0); t.lineTo(i + 0.5, TILE);
                t.moveTo(0, i + 0.5); t.lineTo(TILE, i + 0.5);
                t.stroke();
            }
            return tile;
        }
        const bgPattern = ctx.createPattern(makeBackgroundTile(), 'repeat');

        // =====================================================================
        // Draw
        // =====================================================================
        function draw(time) {
            const w = window.innerWidth, h = window.innerHeight;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillStyle = '#020207';
            ctx.fillRect(0, 0, w, h);

            // World view: zoomed around the camera
            const z = camera.zoom;
            const viewW = w / z, viewH = h / z;
            const camX = camera.x - viewW / 2;
            const camY = camera.y - viewH / 2;
            view.x = camX;
            view.y = camY;
            view.zoom = z;
            ctx.setTransform(dpr * z, 0, 0, dpr * z, -camX * dpr * z, -camY * dpr * z);

            const left = Math.max(0, camX), top = Math.max(0, camY);
            const right = Math.min(WORLD.width, camX + viewW), bottom = Math.min(WORLD.height, camY + viewH);
            if (right > left && bottom > top) {
                ctx.fillStyle = bgPattern;
                ctx.fillRect(left, top, right - left, bottom - top);
            }

            ctx.strokeStyle = 'rgba(120, 160, 255, 0.5)';
            ctx.lineWidth = 3 / z;
            ctx.strokeRect(0, 0, WORLD.width, WORLD.height);

            // Faint paths for things orbiting you
            const orbitBounds = clusterBounds();
            ctx.strokeStyle = 'rgba(180, 200, 255, 0.12)';
            ctx.lineWidth = 1.5 / z;
            for (const p of free) {
                if (!p.orbit) continue;
                ctx.beginPath();
                ctx.arc(orbitBounds.cx, orbitBounds.cy, orbitDistance(p, orbitBounds), 0, Math.PI * 2);
                ctx.stroke();
            }
            if (playerOrbit) { // your path around what you're orbiting
                ctx.strokeStyle = 'rgba(255, 230, 150, 0.25)';
                ctx.beginPath();
                ctx.arc(playerOrbit.target.x, playerOrbit.target.y, playerOrbitDistance(orbitBounds), 0, Math.PI * 2);
                ctx.stroke();
            }

            // Free particles (only the ones on screen)
            const margin = 90 / z;
            for (const p of free) {
                if (p.x + p.r + margin < camX || p.x - p.r - margin > camX + viewW ||
                    p.y + p.r + margin < camY || p.y - p.r - margin > camY + viewH) continue;
                drawFree(p, time);
            }

            // Player's group: gluon bonds first, then the quarks on top
            if (stage !== 'molecule') {
                for (const [a, b] of bonds) drawGluon(a.x, a.y, a.r, b.x, b.y, b.r, time, 4);
            }

            // Glow around you (flares up while a hadron is forming)
            const pulse = 1 + Math.sin(time / 250) * 0.06;
            const flare = forming ? 1 + (1 - forming.timer / 0.8) * 2 : 1;
            const gx = cluster.reduce((s, q) => s + q.x, 0) / cluster.length;
            const gy = cluster.reduce((s, q) => s + q.y, 0) / cluster.length;
            const glowR = stage === 'molecule'
                ? clusterBounds().extent * 1.3 * pulse
                : Math.max(Math.min(player.r * 3.5, player.r + 60), cluster.length > 1 ? 70 : 0) * pulse * flare;
            const glow = ctx.createRadialGradient(gx, gy, 0, gx, gy, glowR);
            glow.addColorStop(0, `rgba(255, 255, 255, ${forming ? 0.5 : 0.25})`);
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(gx, gy, glowR, 0, Math.PI * 2);
            ctx.fill();

            if (stage === 'molecule') drawPlayerMolecule();
            else for (const q of cluster) drawFree(q, time);

            // Floating messages (kept readable when zoomed out)
            const now = performance.now();
            for (let i = floaters.length - 1; i >= 0; i--) {
                const f = floaters[i];
                const age = (now - f.born) / 1500;
                if (age >= 1) { floaters.splice(i, 1); continue; }
                ctx.globalAlpha = 1 - age * age;
                drawLabel(f.text, f.x, f.y - age * 30 / z, 13 / z, false, false);
                ctx.globalAlpha = 1;
            }

            // Ring around the particle you clicked
            if (selected) {
                let sx = selected.x, sy = selected.y, sr = selected.r;
                if (selected === player && stage === 'molecule') {
                    const b = clusterBounds();
                    sx = b.cx; sy = b.cy; sr = b.extent;
                }
                const rr = Math.max(sr, 6) + (7 + Math.sin(time / 200) * 2) / z;
                ctx.setLineDash([6 / z, 5 / z]);
                ctx.lineDashOffset = -time / 40 / z;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = 2 / z;
                ctx.beginPath();
                ctx.arc(sx, sy, rr, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Screen-space overlay: pointer to the next useful thing
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            // Goal pointer (yellow "___ this way" arrows) is turned off for now.
            // The code is kept below; uncomment this line to bring it back.
            // drawGoalPointer(w, h, z, time);

            // The "Press R / Tap here to start over" prompt still needs checking
            if (--restartCheckFrame <= 0) { updateRestartPrompt(); restartCheckFrame = 15; }
            drawLongPressRing(time);
        }
        let restartCheckFrame = 0;

        // =====================================================================
        // Goal pointer: a yellow arrow at the edge of the screen pointing to
        // the nearest thing you can use next. 1 chevron = close, 2 = medium,
        // 3 = far.
        // =====================================================================
        let goal = null;
        let goalCheckFrame = 0;

        // Can any atom of this free atom/molecule still make a bond?
        function hasOpenBond(layout) {
            if (layout.open === undefined) {
                layout.open = layout.Zs.some((Z, i) => valenceOf(Z) - layout.deg[i] > 0);
            }
            return layout.open;
        }

        // Can you still bond with anything right now?
        function youCanBond() {
            if (stage === 'molecule') {
                return cluster.length < MAX_MOLECULE_ATOMS && cluster.some(m => valenceOf(m.Z) - m.deg > 0);
            }
            return player.type.kind === 'atom' && player.atom.E === player.atom.Z && valenceOf(player.atom.Z) > 0;
        }

        function isUseful(p) {
            if (p.orbit) return false;
            if (p.chem) return youCanBond() && hasOpenBond(p.layout) &&
                (stage !== 'molecule' || cluster.length + p.layout.Zs.length <= MAX_MOLECULE_ATOMS);
            if (isQuarkKind(p.type)) return canJoin(p).ok;
            const check = canAbsorb(p);
            return !!(check && check.ok);
        }

        // How good is grabbing p? Higher = leads somewhere; tiny = dead end.
        // Returns { score, note } where note explains the choice.
        const DEAD_END = 0.05;
        function goalScore(p, ctxInfo) {
            // --- Quarks: aim for a proton or neutron (the only way to atoms) ---
            if (isQuarkKind(p.type)) {
                if (p.type.kind === 'antiquark') return { score: DEAD_END }; // makes a meson: dead end
                const flavors = [...cluster.map(q => q.type.sym), p.type.sym];
                const ups = flavors.filter(f => f === 'u').length, downs = flavors.filter(f => f === 'd').length;
                if (ups + downs === flavors.length && ups <= 2 && downs <= 2) {
                    const n = flavors.length;
                    const makes = n === 3 ? (ups === 2 ? 'a proton' : 'a neutron') : null;
                    return { score: 5, note: makes ? `makes ${makes}!` : 'on the way to a proton or neutron' };
                }
                return { score: DEAD_END }; // exotic baryon: can't build atoms
            }
            // --- Atoms and molecules: keep open bonds to grow, or finish a new named molecule ---
            if (p.chem) {
                const theirOpen = p.layout.Zs.reduce((s, Z, i) => s + Math.max(0, valenceOf(Z) - p.layout.deg[i]), 0);
                const open = Math.min(6, ctxInfo.yourOpen + theirOpen - 2);
                const result = MOLECULE_BY_FORMULA[hillFormula([...ctxInfo.yourZs, ...p.layout.Zs])];
                let score = open, note = open > 0 ? `${open} open bond${open === 1 ? '' : 's'} to keep growing` : null;
                if (result) {
                    score += discovered.has(result[0]) ? 0.3 : 2;
                    note = `makes ${result[1]}${discovered.has(result[0]) ? '' : ' (new!)'}`;
                }
                if (open <= 0) score *= 0.6; // finishes your molecule: nothing left to add
                return { score: Math.max(score, DEAD_END), note };
            }
            // --- Protons, neutrons, alphas, electrons: growing your atom always keeps options open ---
            return { score: 3 };
        }

        function findGoal() {
            const b = clusterBounds();
            const bondable = youCanBond();
            // Collect what you could use, nearest first
            const options = [];
            for (const p of free) {
                if (p.chem && !bondable) continue;
                if (!isUseful(p)) continue;
                options.push({ p, d: Math.hypot(p.x - b.cx, p.y - b.cy) });
            }
            if (!options.length) return null;
            options.sort((a, c) => a.d - c.d);

            const ctxInfo = {};
            if (bondable) {
                ctxInfo.yourZs = stage === 'molecule' ? cluster.map(m => m.Z) : [player.atom.Z];
                ctxInfo.yourOpen = stage === 'molecule'
                    ? cluster.reduce((s, m) => s + Math.max(0, valenceOf(m.Z) - m.deg), 0)
                    : valenceOf(player.atom.Z);
            }
            // Best value for the distance: a great option a bit farther away
            // beats a dead end right next to you
            let best = null, bestCost = Infinity;
            for (const o of options.slice(0, 40)) {
                const { score, note } = goalScore(o.p, ctxInfo);
                const cost = (o.d + 300) / score;
                if (cost < bestCost) { bestCost = cost; best = o.p; best.goalNote = note; }
            }
            return best;
        }

        function goalLabel(p) {
            let name = p.type.name;
            if (p.color && isQuarkKind(p.type)) name = `${colorName(p.color)} ${name.toLowerCase()}`;
            name = name.charAt(0).toUpperCase() + name.slice(1) + ' this way';
            return p.goalNote ? `${name} (${p.goalNote})` : name;
        }

        // --- Dead ends: show a big "press R" prompt while you're stuck ---
        const restartEl = document.getElementById('restart');
        function deadEndReason() {
            if (player.type.kind === 'hadron' && !player.atom) {
                return `${aOrAn(player.type.name).replace(/^a/, 'A')} ${player.type.name} can't build atoms`;
            }
            if (stage !== 'molecule' && player.atom && player.atom.Z === MAX_Z && player.atom.E === MAX_Z) {
                return 'You reached oganesson, the end of the periodic table!';
            }
            if (stage === 'molecule') {
                if (cluster.length >= MAX_MOLECULE_ATOMS) return 'Your molecule is as big as it can get!';
                if (!youCanBond()) return 'Your molecule is complete: no open bonds left!';
            }
            return null;
        }
        let shownDeadEnd;
        function updateRestartPrompt() {
            const reason = deadEndReason();
            if (reason === shownDeadEnd) return;
            shownDeadEnd = reason;
            restartEl.classList.toggle('show', !!reason);
            if (reason) restartEl.querySelector('span').textContent = reason;
        }
        restartEl.addEventListener('click', () => location.reload());

        function drawGoalPointer(w, h, z, time) {
            // Re-pick the goal a few times a second (or right away if it's gone)
            if (--goalCheckFrame <= 0 || (goal && !free.includes(goal)) || (goal && !isUseful(goal))) {
                goal = findGoal();
                goalCheckFrame = 15;
                updateRestartPrompt();
            }
            if (!goal) return;

            // Where the goal is on screen
            const sx = (goal.x - view.x) * z, sy = (goal.y - view.y) * z;
            const pad = goal.r * z;
            if (sx > -pad && sx < w + pad && sy > -pad && sy < h + pad) return; // it's visible already

            // Ray from the screen center to the goal, clipped to the screen edge
            const cx = w / 2, cy = h / 2;
            const dx = sx - cx, dy = sy - cy;
            // Keep clear of the stats line at the top and the hint at the bottom
            const isTouch = document.body.classList.contains('touch');
            const side = 44, top = isTouch ? 100 : 70, bottom = isTouch ? 200 : 90; // stay clear of the joystick/RUN button
            const scale = Math.min(
                (w / 2 - side) / Math.max(Math.abs(dx), 0.001),
                (dy < 0 ? h / 2 - top : h / 2 - bottom) / Math.max(Math.abs(dy), 0.001));
            const ex = cx + dx * scale, ey = cy + dy * scale;
            const ang = Math.atan2(dy, dx);
            const ux = Math.cos(ang), uy = Math.sin(ang);

            // How far, in screens
            const screens = Math.hypot(dx, dy) / (Math.max(w, h) / 2);
            const count = screens < 2 ? 1 : screens < 5 ? 2 : 3;

            const pulse = 0.75 + Math.sin(time / 220) * 0.25;
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(255, 210, 60, 0.8)';
            ctx.shadowBlur = 10;
            for (let k = 0; k < count; k++) {
                const px = ex - ux * k * 11, py = ey - uy * k * 11;
                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(ang);
                ctx.beginPath();
                ctx.moveTo(-6, -10);
                ctx.lineTo(4, 0);
                ctx.lineTo(-6, 10);
                ctx.strokeStyle = `rgba(255, 214, 74, ${pulse - k * 0.12})`;
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();
            }
            ctx.restore();

            // Label, tucked inside the arrow and kept on screen
            const text = goalLabel(goal);
            ctx.font = 'bold 13px system-ui, sans-serif';
            const tw = ctx.measureText(text).width;
            // Step back from the arrow far enough that the text never covers it
            const back = 16 + count * 11 + Math.abs(ux) * tw / 2 + Math.abs(uy) * 6;
            let lx = ex - ux * back, ly = ey - uy * back;
            lx = Math.max(tw / 2 + 8, Math.min(w - tw / 2 - 8, lx));
            ly = Math.max(16, Math.min(h - 16, ly));
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.strokeText(text, lx, ly);
            ctx.fillStyle = 'rgb(255, 214, 74)';
            ctx.fillText(text, lx, ly);
        }

        // =====================================================================
        // Click a particle to learn about it
        // =====================================================================
        const view = { x: 0, y: 0, zoom: 1 };
        let selected = null;
        const infoEl = document.getElementById('info');
        const infoSwatch = document.getElementById('info-swatch');
        const infoName = document.getElementById('info-name');
        const infoKind = document.getElementById('info-kind');
        const infoFacts = document.getElementById('info-facts');
        const infoDesc = document.getElementById('info-desc');

        function particleAt(wx, wy) {
            // Bound quarks are drawn on top, so check them first.
            // Tiny particles get a bigger click target.
            let best = null, bestD = Infinity;
            for (const list of [cluster, free]) {
                for (const p of list) {
                    const d = Math.hypot(p.x - wx, p.y - wy);
                    if (d <= Math.max(p.r, 14 / view.zoom) && d < bestD) { best = p; bestD = d; }
                }
                if (best) return best;
            }
            return null;
        }

        function addFact(label, value) {
            const dt = document.createElement('dt');
            dt.textContent = label;
            const dd = document.createElement('dd');
            dd.textContent = value;
            infoFacts.append(dt, dd);
        }

        function showInfo(p) {
            selected = p;
            const t = p.type;
            const info = t.info || INFO[t.id];

            infoName.textContent = (p.isPlayer ? 'You! ' : '') + t.name;
            let kind = t.kindLabel || KIND_LABEL[t.kind];
            if (t.kind === 'lepton' && t.look === ANTILEPTON) kind = 'Antilepton';
            if (t.neutrino) kind = t.bar ? 'Antineutrino (lepton)' : 'Neutrino (lepton)';
            infoKind.textContent = kind;

            const look = p.color ? COLOR_CHARGE[p.color] : (t.look || { base: '#888', light: '#bbb', dark: '#333' });
            infoSwatch.style.background = `radial-gradient(circle at 35% 30%, ${look.light}, ${look.base} 50%, ${look.dark})`;
            if (t.kind === 'hadron') infoSwatch.style.background = 'radial-gradient(circle at 35% 30%, #d0d0d8, #8a8a98)';
            if (t.kind === 'atom') infoSwatch.style.background = 'radial-gradient(circle at 50% 50%, #e0555a 0 30%, #5a4aa0 34%, #2a2160)';
            if (t.kind === 'nucleus') infoSwatch.style.background = 'radial-gradient(circle at 35% 30%, #ffb4b4, #e0555a 50%, #7a1a1e)';
            if (t.kind === 'element') {
                const c = atomColor(t.Z);
                infoSwatch.style.background = `radial-gradient(circle at 35% 30%, ${shade(c, 0.6)}, ${c} 50%, ${shade(c, -0.55)})`;
            }
            if (t.kind === 'molecule') {
                const Zs = p === player ? cluster.map(m => m.Z) : p.layout.Zs;
                const [c1, c2] = [atomColor(Zs[0]), atomColor(Zs.find(Z => Z !== Zs[0]) || Zs[0])];
                infoSwatch.style.background = `linear-gradient(135deg, ${c1} 0 50%, ${c2} 50%)`;
            }
            infoSwatch.textContent = t.kind === 'molecule' ? '' : t.sym.replace(/[⁺⁻⁰]/g, '');
            infoSwatch.style.textDecoration = t.bar ? 'overline' : 'none';
            infoSwatch.style.color = t.kind === 'element' && brightness(atomColor(t.Z)) > 0.62 ? '#222' : '#fff';

            infoFacts.replaceChildren();
            if (t.kind === 'element') {
                const v = valenceOf(t.Z);
                addFact('Symbol', t.sym);
                addFact('Element', `${t.elementName} (element #${t.Z})`);
                addFact('Mass', `${t.massU.toLocaleString(undefined, { maximumFractionDigits: 3 })} atomic mass units`);
                addFact('Bonds it makes', v === 0 ? 'None (noble gases don\'t share)' : v);
            } else if (t.kind === 'molecule') {
                addFact('Formula', t.sym);
                addFact('Atoms', t.atomCount);
                addFact('Mass', `${t.massU.toLocaleString(undefined, { maximumFractionDigits: 2 })} atomic mass units`);
                if (p === player) {
                    const freeBonds = cluster.reduce((s, m) => s + Math.max(0, valenceOf(m.Z) - m.deg), 0);
                    addFact('Open bonds', freeBonds ? `${freeBonds} (room to grow)` : '0 (complete!)');
                }
            } else {
                addFact('Symbol', (t.bar ? 'anti-' : '') + t.sym);
            }
            if (t.kind === 'element' || t.kind === 'molecule') {
                // mass already shown above
            } else if (t.kind === 'atom') {
                const { Z, N, E } = p.atom;
                addFact('Element', `${t.elementName} (element #${Z})`);
                addFact('Protons', Z);
                addFact('Neutrons', N);
                addFact('Electrons', E);
                addFact('Mass', `About ${Z + N} atomic mass unit${Z + N === 1 ? '' : 's'}`);
            } else {
                addFact('Mass', formatMass(t));
            }
            addFact('vs. up quark', compareToUp(t));
            addFact('Charge', info.charge);
            if (p.color) addFact('Color charge', p.color.replace('anti', 'anti-'));
            if (t.kind === 'hadron') {
                addFact('Made of', p.inner.map(q => (q.anti ? 'anti-' : '') + QUARK_BY_SYM[q.sym].name.toLowerCase()).join(' + '));
            }
            if (t.kind === 'nucleus') addFact('Made of', '2 protons + 2 neutrons');
            if (p.bonded && !p.isPlayer && !p.chem) addFact('Status', 'Bound to you by gluons');

            infoDesc.textContent = info.desc;
            infoEl.classList.add('open');
        }

        function hideInfo() {
            selected = null;
            infoEl.classList.remove('open');
        }

        const toWorld = (e) => [view.x + e.clientX / view.zoom, view.y + e.clientY / view.zoom];
        canvas.addEventListener('click', (e) => {
            if (performance.now() < ignoreClickUntil) return; // this "click" was really a long-press or pinch
            let p = particleAt(...toWorld(e));
            if (p && p.chemMember) p = player; // any atom of your molecule shows the whole molecule
            if (p) showInfo(p); else hideInfo();
        });
        // =====================================================================
        // Right-click something lighter than you to make it orbit you
        // (subatomic and atomic world only). Right-click it again to let go.
        // =====================================================================
        function yourMass() { // in MeV/c², the same units particles use
            if (player.type.kind === 'quark') return cluster.reduce((s, q) => s + q.type.mass, 0);
            return player.type.mass;
        }

        function orbitDistance(p, bounds) {
            return bounds.extent + p.r + 30 + p.orbit.lane * 24;
        }

        function startOrbit(p) {
            const b = clusterBounds();
            const lanes = free.filter(q => q.orbit).length;
            p.orbit = {
                angle: Math.atan2(p.y - b.cy, p.x - b.cx),
                lane: lanes % 4,
                speed: 140,               // how fast it travels around you
                dir: Math.random() < 0.5 ? 1 : -1,
            };
        }

        // --- You orbiting something heavier ---
        let playerOrbit = null; // { target, angle, speed, dir }

        function playerOrbitDistance(b) {
            return playerOrbit.target.r + b.extent + 40;
        }

        function startPlayerOrbit(target) {
            const b = clusterBounds();
            playerOrbit = {
                target,
                angle: Math.atan2(b.cy - target.y, b.cx - target.x),
                speed: 160,
                dir: Math.random() < 0.5 ? 1 : -1,
            };
        }

        // Each step: carry your whole group (and everything orbiting you)
        // around the target, moving along with it wherever it drifts
        function orbitAroundTarget(dt) {
            const t = playerOrbit.target;
            if (!free.includes(t)) { playerOrbit = null; return; } // it's gone
            const b = clusterBounds();
            const dist = playerOrbitDistance(b);
            const o = playerOrbit;
            o.angle += (o.speed / dist) * o.dir * dt;
            const dx = t.x + Math.cos(o.angle) * dist - b.cx;
            const dy = t.y + Math.sin(o.angle) * dist - b.cy;
            const vx = t.vx - Math.sin(o.angle) * o.speed * o.dir;
            const vy = t.vy + Math.cos(o.angle) * o.speed * o.dir;
            for (const q of cluster) {
                q.x += dx; q.y += dy;
                q.vx = vx; q.vy = vy;
            }
        }

        function stopPlayerOrbit() {
            playerOrbit = null; // you keep your orbit speed and drift off, then WASD works again
        }

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            // Some tablets also send a contextmenu on long-press; the touch code handles that itself
            if (canvasTouches.size > 0 || performance.now() < ignoreClickUntil) return;
            orbitActionAt(e.clientX, e.clientY);
        });

        // =====================================================================
        // Touch gestures on the game: long-press = orbit (like right-click),
        // two-finger pinch = zoom (like the scroll wheel)
        // =====================================================================
        const LONG_PRESS_MS = 500;
        const canvasTouches = new Map(); // pointerId -> { x, y }
        let longPress = null;            // { x, y, start, timer }
        let pinchDist = null;
        let ignoreClickUntil = 0;

        function cancelLongPress() {
            if (longPress) clearTimeout(longPress.timer);
            longPress = null;
        }
        function twoFingerDistance() {
            const [a, b] = [...canvasTouches.values()];
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'touch') return;
            canvasTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (canvasTouches.size === 1) {
                const x = e.clientX, y = e.clientY;
                longPress = {
                    x, y, start: performance.now(),
                    timer: setTimeout(() => {
                        longPress = null;
                        ignoreClickUntil = performance.now() + 600; // don't also treat it as a tap
                        if (navigator.vibrate) navigator.vibrate(25);
                        orbitActionAt(x, y);
                    }, LONG_PRESS_MS),
                };
            } else {
                cancelLongPress();
                if (canvasTouches.size === 2) pinchDist = twoFingerDistance();
            }
        });
        canvas.addEventListener('pointermove', (e) => {
            if (!canvasTouches.has(e.pointerId)) return;
            canvasTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (longPress && Math.hypot(e.clientX - longPress.x, e.clientY - longPress.y) > 14) cancelLongPress();
            if (canvasTouches.size === 2 && pinchDist) {
                const d = twoFingerDistance();
                userZoom = Math.max(0.1, Math.min(8, userZoom * d / pinchDist));
                pinchDist = d;
                ignoreClickUntil = performance.now() + 400;
            }
        });
        const endCanvasTouch = (e) => {
            if (!canvasTouches.has(e.pointerId)) return;
            canvasTouches.delete(e.pointerId);
            cancelLongPress();
            if (canvasTouches.size < 2) pinchDist = null;
        };
        canvas.addEventListener('pointerup', endCanvasTouch);
        canvas.addEventListener('pointercancel', endCanvasTouch);

        // A ring that fills up under your finger while you long-press
        function drawLongPressRing(time) {
            if (!longPress) return;
            const t = Math.min(1, (performance.now() - longPress.start) / LONG_PRESS_MS);
            if (t < 0.15) return; // don't flash it on quick taps
            ctx.save();
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255, 214, 74, 0.25)';
            ctx.beginPath();
            ctx.arc(longPress.x, longPress.y, 34, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255, 214, 74, 0.95)';
            ctx.beginPath();
            ctx.arc(longPress.x, longPress.y, 34, -Math.PI / 2, -Math.PI / 2 + t * Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        // Right-click / long-press: make something orbit you, or orbit it yourself
        function orbitActionAt(clientX, clientY) {
            const p = particleAt(...toWorld({ clientX, clientY }));
            if (!p || cluster.includes(p)) return;
            if (stage === 'molecule') {
                floatText(p, 'Orbiting only works in the subatomic and atomic world');
                return;
            }
            if (playerOrbit && playerOrbit.target === p) {
                stopPlayerOrbit();
                p.msgUntil = 0;
                floatText(p, 'You let go! WASD to move');
                return;
            }
            if (p.orbit) {
                delete p.orbit; // let it fly off along its orbit
                floatText(p, 'Let go!');
                return;
            }
            const name = p.type.name.toLowerCase();
            const mine = yourMass();
            p.msgUntil = 0;
            if (p.type.mass < mine) {
                startOrbit(p);
                floatText(p, `The ${name} is orbiting you!`);
            } else if (p.type.mass > mine) {
                startPlayerOrbit(p);
                floatText(p, `You're orbiting the ${name}! Right-click it again to let go`);
            } else {
                floatText(p, `Same mass as you, so neither of you orbits`);
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            canvas.style.cursor = particleAt(...toWorld(e)) ? 'pointer' : 'default';
        });
        document.getElementById('info-close').addEventListener('click', hideInfo);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hideInfo();
            if (e.key.toLowerCase() === 'r' && player.type.kind !== 'quark') location.reload();
        });
        // =====================================================================
        // Loop (fixed physics steps so the gluon springs stay stable)
        // =====================================================================
        const STEP = 1 / 120;
        let last = performance.now();
        let acc = 0;
        function frame(now) {
            acc += Math.min((now - last) / 1000, 0.1);
            last = now;
            while (acc >= STEP) {
                step(STEP);
                acc -= STEP;
            }
            draw(now);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
