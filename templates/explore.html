<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploring {{ object_name }} - Kids at Home</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ static_file('css/main.css') }}">
    <link rel="stylesheet" href="{{ static_file('css/gravity_lab.css') }}">
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cosmic-purple': '#7C3AED',
                        'space-blue': '#2563EB',
                        'star-gold': '#D97706',
                        'nebula-pink': '#BE185D',
                        'galaxy-indigo': '#4F46E5'
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'wiggle': 'wiggle 1s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen" style="background-image: url('{{ static_file('images/ChatGPT-Gravity-Lab-Mars.png') }}'); background-size: cover; background-position: center; background-attachment: fixed;">
    <!-- Navigation -->
    <nav class="relative bg-gradient-to-b from-blue-900/95 to-blue-800/95 backdrop-blur-sm sticky top-0 z-50">
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <!-- Logo Section -->
                <a href="/" class="group flex items-center space-x-3 hover:scale-105 transition-transform duration-300">
                    <div class="relative">
                        <span class="text-2xl">🚀</span>
                    </div>
                    <span class="text-2xl font-bold text-white group-hover:text-gray-200 transition-colors duration-300">
                        Kids at Home
                    </span>
                </a>
                
                <!-- Navigation Links -->
                <div class="hidden md:flex space-x-6">
                    <a href="/" class="group flex items-center space-x-2 text-gray-300 hover:text-blue-400 transition-colors duration-300 relative">
                        <i class="fas fa-home text-lg group-hover:scale-110 transition-transform duration-300"></i>
                        <span class="font-medium">Home</span>
                        <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-400 group-hover:w-full transition-all duration-300"></div>
                    </a>
                    <a href="/system_generator" class="group flex items-center space-x-2 text-gray-300 hover:text-purple-400 transition-colors duration-300 relative">
                        <i class="fas fa-star text-lg group-hover:scale-110 transition-transform duration-300"></i>
                        <span class="font-medium">Space Explorer</span>
                        <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-purple-400 group-hover:w-full transition-all duration-300"></div>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <!-- Background Stars -->
        <div class="absolute inset-0 opacity-60">
            <div class="absolute top-1/5 left-1/5 w-1 h-1 bg-white rounded-full"></div>
            <div class="absolute top-1/3 right-1/4 w-0.5 h-0.5 bg-blue-300 rounded-full"></div>
            <div class="absolute bottom-1/3 left-1/6 w-1.5 h-1.5 bg-purple-300 rounded-full"></div>
            <div class="absolute bottom-1/5 right-1/5 w-0.5 h-0.5 bg-cyan-300 rounded-full"></div>
            <div class="absolute top-1/2 left-1/8 w-1 h-1 bg-white rounded-full"></div>
            <div class="absolute top-2/3 right-1/8 w-0.5 h-0.5 bg-blue-300 rounded-full"></div>
            <div class="absolute top-1/6 left-1/3 w-1 h-1 bg-purple-300 rounded-full"></div>
            <div class="absolute bottom-1/4 left-1/2 w-0.5 h-0.5 bg-cyan-300 rounded-full"></div>
            <div class="absolute top-3/4 right-1/3 w-1.5 h-1.5 bg-white rounded-full"></div>
            <div class="absolute bottom-1/6 right-1/2 w-1 h-1 bg-blue-300 rounded-full"></div>
        </div>
        
        <!-- Main Exploration Card -->
        <div class="relative z-10 max-w-4xl mx-auto w-full px-4">
            <div class="group relative mb-8">
                <div class="absolute -inset-1 bg-gradient-to-r from-cyan-600/30 via-blue-600/30 to-indigo-600/30 rounded-xl blur-sm group-hover:blur-md transition-all duration-500"></div>
                <div class="relative bg-gray-900/80 backdrop-blur-sm rounded-xl p-8 border border-gray-700/50">
                    <!-- Header -->
                    <div class="text-center mb-8">
                        <div class="flex justify-center mb-4">
                            <i class="fas fa-rocket text-6xl text-cyan-400 animate-pulse-slow"></i>
                        </div>
                        <h1 class="text-4xl md:text-5xl font-bold mb-4 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                            Exploring {{ object_name }}
                        </h1>
                        <p class="text-xl text-gray-300 mb-6">
                            Welcome to your exploration of {{ object_name }}!
                        </p>
                    </div>

                    <!-- Object Information Card -->
                    <div class="bg-gray-800/60 backdrop-blur-sm rounded-lg p-6 mb-8 border border-gray-600/50">
                        <div class="text-center">
                            <div class="mb-4">
                                <i class="fas fa-star text-4xl text-yellow-400 mb-4"></i>
                            </div>
                            <h2 class="text-3xl font-bold text-white mb-2">{{ object_name }}</h2>
                            <p class="text-lg text-gray-300 mb-6">Celestial Object</p>
                            
                            <!-- Placeholder for future detailed information -->
                            <div class="bg-gray-700/50 rounded-lg p-4 mb-6">
                                <p class="text-gray-300 text-center">
                                    <i class="fas fa-info-circle mr-2"></i>
                                    Detailed exploration features coming soon!
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="text-center space-y-4">
                        <button onclick="goBack()" class="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 text-white font-bold rounded-lg transition-all duration-300 shadow-lg transform hover:scale-105">
                            <i class="fas fa-arrow-left mr-2"></i>
                            Back to Gravity Lab
                        </button>
                        
                        <button onclick="goHome()" class="w-full px-6 py-3 bg-gray-600 hover:bg-gray-500 text-white rounded-lg transition-colors">
                            <i class="fas fa-home mr-2"></i>
                            Go Home
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function goBack() {
            window.location.href = '/gravity_lab';
        }
        
        function goHome() {
            window.location.href = '/';
        }
        
        // Add some interactive effects
        document.addEventListener('DOMContentLoaded', function() {
            // Add floating animation to the star icon
            const starIcon = document.querySelector('.fa-star');
            if (starIcon) {
                starIcon.style.animation = 'float 6s ease-in-out infinite';
            }
        });
    </script>
</body>
</html>
