<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life on Exoplanet Clicker</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: rgb(32, 31, 31);
            color: #fff;
            font-family: system-ui, sans-serif;
        }
        /* Text can't be selected, so spam-clicking doesn't highlight the page or
           open the browser's selection popup. */
        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #star-dust-hud {
            z-index: 10;
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 1.1rem;
        }
        .hud-row {
            display: flex;
            gap: 6px;
        }
        .hud-card {
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            background: linear-gradient(rgba(40, 42, 56, 0.85), rgba(16, 17, 24, 0.85));
            white-space: nowrap;
        }
        .hud-large {
            min-width: 170px;
        }
        .hud-value {
            font-weight: bold;
        }
        .hud-icon {
            margin-right: 4px;
        }
        .hud-unit {
            font-weight: normal;
            font-size: 0.85rem;
            color: #bbb;
        }
        .hud-sub {
            font-size: 0.8rem;
            color: #888;
        }
        .hud-small {
            flex: 1;
            font-size: 0.8rem;
            color: #888;
        }
        .hud-small span {
            font-weight: bold;
            color: #fff;
        }
        #star-dust-amount {
            color: #ffd86b;
        }
        /* The viewport is the screen; the map is the level background, moved and
           scaled inside it by the camera (see the pan/zoom script). */
        #viewport {
            position: fixed;
            inset: 0;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }
        #viewport.dragging {
            cursor: grabbing;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            will-change: transform;
            background: url("{{ static_file('images/life_on_exoplanet_level_1_background.jpg') }}") 0 0 / 100% 100% no-repeat;
        }
        /* Lines between an object and what it depends on, drawn under the objects. */
        #links {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }
        .link {
            stroke: rgba(255, 255, 255, 0.25);
            stroke-width: 3;
            stroke-dasharray: 8 8;
            stroke-linecap: round;
            transition: stroke 0.6s;
        }
        .link.ready {
            stroke: rgba(255, 216, 107, 0.6);
        }
        .link.active {
            stroke: #ffd86b;
            stroke-dasharray: none;
            filter: drop-shadow(0 0 4px #ffd86b);
        }
        .world-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: var(--node-size);
        }
        .world-object {
            width: var(--node-size);
            height: var(--node-size);
            box-sizing: border-box;
            border: 2px solid gray;
            object-fit: cover;
            display: block;
        }
        .world-node-name {
            margin-top: 6px;
            width: 240px;
            text-align: center;
            font-weight: bold;
        }
        .world-node-status {
            width: 240px;
            text-align: center;
            font-size: 0.8rem;
            color: #ffd86b;
        }
        .world-node.locked {
            cursor: pointer;
        }
        .world-node.locked .world-object {
            filter: grayscale(1) brightness(0.4);
        }
        .world-node.locked .world-node-name,
        .world-node.locked .world-node-status {
            color: #888;
        }
        .world-node.locked.affordable .world-node-status {
            color: #ffd86b;
        }

        /* Locked objects bob around in place. */
        .world-object {
            transition: filter 0.6s;
        }
        .world-node.locked .world-object {
            animation: world-object-bob 6s ease-in-out infinite;
        }
        @keyframes world-object-bob {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(4px, -5px) rotate(1.5deg); }
            40% { transform: translate(-3px, -8px) rotate(-1deg); }
            60% { transform: translate(-5px, 2px) rotate(1deg); }
            80% { transform: translate(3px, 4px) rotate(-1.5deg); }
        }

        /* Celebration played over an object when it unlocks. */
        .world-object.pop {
            animation: world-object-pop 0.7s ease-out;
        }
        @keyframes world-object-pop {
            0% { transform: scale(1); filter: brightness(1); }
            30% { transform: scale(1.18); filter: brightness(1.8); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        .celebration {
            position: absolute;
            top: 0;
            left: 0;
            width: var(--node-size);
            height: var(--node-size);
            pointer-events: none;
        }
        .celebration-flash {
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.95), rgba(255, 216, 107, 0) 70%);
            animation: celebration-flash 0.8s ease-out forwards;
        }
        @keyframes celebration-flash {
            from { opacity: 1; transform: scale(0.6); }
            to { opacity: 0; transform: scale(1.6); }
        }
        .celebration-ring {
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            border: 3px solid #ffd86b;
            border-radius: 50%;
            box-shadow: 0 0 16px #ffd86b;
            animation: celebration-ring 1s ease-out forwards;
        }
        @keyframes celebration-ring {
            from { opacity: 1; transform: scale(0.4); }
            to { opacity: 0; transform: scale(2.2); }
        }
        .celebration-particle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            margin: -4px 0 0 -4px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
            background: currentColor;
            animation: celebration-particle 1s ease-out forwards;
        }
        @keyframes celebration-particle {
            from { opacity: 1; transform: translate(0, 0) scale(1); }
            to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
        }
        @media (prefers-reduced-motion: reduce) {
            .world-node.locked .world-object,
            .world-object.pop,
            .celebration-ring,
            .celebration-particle {
                animation: none;
            }
            .celebration-ring,
            .celebration-particle {
                display: none;
            }
        }

        /* Floating "+N" shown where a click collected star dust. */
        .click-popup {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.3rem;
            color: #ffd86b;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 1px 2px rgba(0, 0, 0, 0.9);
            transform: translate(-50%, -50%);
            animation: click-popup 0.9s ease-out forwards;
        }
        @keyframes click-popup {
            from { opacity: 1; margin-top: 0; }
            to { opacity: 0; margin-top: -60px; }
        }

        /* Info box for the object that was last clicked. */
        .world-node.selected .world-object {
            border-color: #ffd86b;
        }
        #info-box {
            position: fixed;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            z-index: 20;
            box-sizing: border-box;
            width: min(420px, calc(100vw - 32px));
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: linear-gradient(rgba(40, 42, 56, 0.95), rgba(16, 17, 24, 0.95));
            cursor: pointer;
        }
        #info-box[hidden] {
            display: none;
        }
        .info-close {
            position: absolute;
            top: 6px;
            right: 8px;
            padding: 2px 8px;
            border: 0;
            background: none;
            color: #bbb;
            font-size: 1.3rem;
            line-height: 1;
            cursor: pointer;
        }
        .info-close:hover {
            color: #fff;
        }
        .info-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding-right: 24px;
        }
        #info-image {
            width: 56px;
            height: 56px;
            flex: none;
            object-fit: cover;
            border: 2px solid gray;
        }
        #info-name {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .info-type {
            display: inline-block;
            margin-top: 2px;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 0.08em;
        }
        .info-type.BASE { color: #8fd3ff; }
        .info-type.GENERATOR { color: #ffd86b; }
        .info-type.EVOLUTION { color: #ff9ad5; }
        #info-description-toggle {
            margin-bottom: 8px;
            color: #8fd3ff;
            font-size: 0.8rem;
        }
        #info-description-toggle[hidden],
        #info-description[hidden] {
            display: none;
        }
        #info-description {
            margin: 0 0 10px;
            color: #bbb;
            font-size: 0.85rem;
            font-style: italic;
        }
        #info-lines {
            font-size: 0.9rem;
            color: #ddd;
        }
        #info-lines p {
            margin: 0 0 6px;
        }
        #info-lines .info-sub {
            color: #888;
            font-size: 0.8rem;
        }
        #info-lines ul {
            margin: 0 0 6px;
            padding-left: 18px;
            font-size: 0.85rem;
        }
        #info-lines li.done {
            color: #ffd86b;
        }
        #info-lines li.locked {
            color: #888;
        }
        #info-unlock {
            width: 100%;
            margin-top: 8px;
            padding: 8px 14px;
            border: 1px solid #ffd86b;
            border-radius: 6px;
            background: rgba(255, 216, 107, 0.15);
            color: #ffd86b;
            font-weight: bold;
            cursor: pointer;
        }
        #info-unlock:disabled {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #888;
            cursor: not-allowed;
        }
        #info-unlock[hidden] {
            display: none;
        }

        /* TEMPORARY: test buttons that add Star Dust, above the reset button. */
        #test-buttons {
            position: fixed;
            left: 16px;
            bottom: 60px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        #test-buttons button {
            padding: 8px 12px;
            border: 1px solid #8ad0ff;
            border-radius: 6px;
            background: #1565c0;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        #test-buttons button:hover {
            background: #1e88e5;
        }

        /* TEMPORARY: reset button and confirm modal, for testing only. */
        #reset-button {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 100;
            padding: 8px 16px;
            border: 1px solid #ff8a8a;
            border-radius: 6px;
            background: #c62828;
            color: #fff;
            font-weight: bold;
            letter-spacing: 0.05em;
            cursor: pointer;
        }
        #reset-button:hover {
            background: #e53935;
        }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
        }
        .modal-backdrop[hidden] {
            display: none;
        }
        .modal {
            max-width: 340px;
            margin: 0 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: linear-gradient(rgb(40, 42, 56), rgb(16, 17, 24));
        }
        .modal h2 {
            margin: 0 0 8px;
            font-size: 1.1rem;
        }
        .modal p {
            margin: 0 0 16px;
            color: #bbb;
            font-size: 0.9rem;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .modal-actions button {
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            cursor: pointer;
        }
        .modal-actions .danger {
            border-color: #ff8a8a;
            background: #c62828;
            font-weight: bold;
        }
        @media (max-width: 480px) {
            #star-dust-hud {
                top: 8px;
                font-size: 0.95rem;
            }
            .hud-large {
                min-width: 0;
            }
            /* Clear of the test and reset buttons in the bottom-left corner. */
            #info-box {
                bottom: 108px;
            }
        }
    </style>
</head>
<body>
    <div id="star-dust-hud">
        <div class="hud-row">
            <div class="hud-card hud-large">
                <div class="hud-value"><span class="hud-icon">&#10024;</span><span id="star-dust-amount">0</span> <span class="hud-unit">Star Dust</span></div>
            </div>
            <div class="hud-card hud-large">
                <div class="hud-value"><span class="hud-icon">&#11088;</span><span id="star-dust-lifetime">0</span> <span class="hud-unit">Lifetime</span></div>
                <div class="hud-sub">total earned</div>
            </div>
        </div>
        <div class="hud-row">
            <div class="hud-card hud-small">Per click <span id="star-dust-per-click"></span></div>
            <div class="hud-card hud-small">Per sec <span id="star-dust-per-sec">0</span></div>
        </div>
    </div>

    <div id="viewport">
        <div id="map"></div>
    </div>

    <div id="info-box" role="dialog" aria-labelledby="info-name" hidden>
        <button id="info-close" class="info-close" type="button" aria-label="Close">&times;</button>
        <div class="info-header">
            <img id="info-image" alt="" draggable="false">
            <div>
                <div id="info-name"></div>
                <span id="info-type" class="info-type"></span>
            </div>
        </div>
        <div id="info-description-toggle"></div>
        <p id="info-description" hidden></p>
        <div id="info-lines"></div>
        <button id="info-unlock" type="button"></button>
    </div>

    <!-- TEMPORARY: test buttons that add Star Dust, for testing only. -->
    <div id="test-buttons">
        <button type="button" data-amount="1000">+1K</button>
        <button type="button" data-amount="100000">+100K</button>
        <button type="button" data-amount="10000000">+10M</button>
    </div>

    <!-- TEMPORARY: reset button and confirm modal, for testing only. -->
    <button id="reset-button" type="button">RESET</button>
    <div id="reset-modal" class="modal-backdrop" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title">
            <h2 id="reset-title">Reset all progress?</h2>
            <p>This clears your Star Dust, lifetime total and unlocked objects. It can't be undone.</p>
            <div class="modal-actions">
                <button id="reset-cancel" type="button">Cancel</button>
                <button id="reset-confirm" type="button" class="danger">Reset</button>
            </div>
        </div>
    </div>

    <script src="{{ static_file('js/life_on_exoplanet_clicker/star_dust.js') }}"></script>
    <script src="{{ static_file('js/life_on_exoplanet_clicker/tech_tree.js') }}"></script>
    <script>
        const IMAGE_URLS = {
            'binary-star-system': "{{ static_file('images/binary_star_system.jpg') }}",
            'fulatun': "{{ static_file('images/fulatun.jpg') }}",
            'lyrath': "{{ static_file('images/lyrath.jpg') }}",
            'entas': "{{ static_file('images/entas.jpg') }}",
            'rooth': "{{ static_file('images/rooth.jpg') }}",
            'ubonae': "{{ static_file('images/ubonae.jpg') }}",
        };
        // The map is the level background at its natural size; objects are placed on
        // it by fractional position (node.x / node.y, 0 to 1), centered on the image.
        const MAP_WIDTH = 2096;
        const MAP_HEIGHT = 1184;
        // Pixel size of an object with scale 1 (the Binary Star System).
        const BASE_NODE_SIZE = 192;
        const viewportEl = document.getElementById('viewport');
        const mapEl = document.getElementById('map');
        mapEl.style.width = MAP_WIDTH + 'px';
        mapEl.style.height = MAP_HEIGHT + 'px';

        // One line per dependency, from the node to what it depends on. They are built
        // from TechTree.dependencies, so new objects get their lines automatically.
        // The lines run center to center; the objects are drawn on top of them.
        const SVG_NS = 'http://www.w3.org/2000/svg';
        const linksEl = document.createElementNS(SVG_NS, 'svg');
        linksEl.id = 'links';
        linksEl.setAttribute('viewBox', '0 0 ' + MAP_WIDTH + ' ' + MAP_HEIGHT);
        mapEl.appendChild(linksEl);
        const linkEls = [];
        TechTree.nodes.forEach(node => {
            TechTree.dependencies(node.id).forEach(depId => {
                const dep = TechTree.get(depId);
                const line = document.createElementNS(SVG_NS, 'line');
                line.setAttribute('class', 'link');
                line.setAttribute('x1', dep.x * MAP_WIDTH);
                line.setAttribute('y1', dep.y * MAP_HEIGHT);
                line.setAttribute('x2', node.x * MAP_WIDTH);
                line.setAttribute('y2', node.y * MAP_HEIGHT);
                linksEl.appendChild(line);
                linkEls.push({ line, nodeId: node.id, depId });
            });
        });

        const nodeEls = new Map();
        TechTree.nodes.forEach(node => {
            const el = document.createElement('div');
            el.className = 'world-node';
            const size = TechTree.scale(node.id) * BASE_NODE_SIZE;
            el.style.setProperty('--node-size', size + 'px');
            el.style.left = (node.x * MAP_WIDTH - size / 2) + 'px';
            el.style.top = (node.y * MAP_HEIGHT - size / 2) + 'px';
            el.innerHTML = '<img class="world-object" draggable="false"><div class="world-node-name"></div><div class="world-node-status"></div>';
            const img = el.querySelector('img');
            img.src = IMAGE_URLS[node.id];
            img.alt = node.name;
            el.querySelector('.world-node-name').textContent = node.name;
            el.addEventListener('click', event => {
                selectNode(node.id);
                if (TechTree.isUnlocked(node.id)) return; // unlocked objects still collect star dust
                // Clicking a locked object shows its info and unlocks it if it can be
                // (same as the info box button); it never also collects star dust.
                event.stopPropagation();
                TechTree.unlock(node.id);
            });
            mapEl.appendChild(el);
            nodeEls.set(node.id, el);
        });

        // Plays the unlock celebration over a node: a flash, a ring and a burst of sparks.
        const SPARK_COLORS = ['#ffd86b', '#ffffff', '#8fd3ff', '#ff9ad5'];
        function celebrate(el, scale) {
            const img = el.querySelector('.world-object');
            img.classList.remove('pop');
            void img.offsetWidth; // restart the animation if it is still running
            img.classList.add('pop');

            const fx = document.createElement('div');
            fx.className = 'celebration';
            fx.innerHTML = '<div class="celebration-flash"></div><div class="celebration-ring"></div>';
            const SPARKS = 18;
            for (let i = 0; i < SPARKS; i++) {
                const angle = (i / SPARKS) * 2 * Math.PI + Math.random() * 0.3;
                const distance = (105 + Math.random() * 75) * scale;
                const spark = document.createElement('div');
                spark.className = 'celebration-particle';
                spark.style.color = SPARK_COLORS[i % SPARK_COLORS.length];
                spark.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
                spark.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
                spark.style.animationDelay = Math.random() * 80 + 'ms';
                fx.appendChild(spark);
            }
            el.appendChild(fx);
            setTimeout(() => fx.remove(), 1500);
        }

        // Syncs each node's locked/unlocked look and status line with the game state.
        // Celebrates a node when it goes from locked to unlocked (not on page load).
        const wasUnlocked = new Map();
        let nodesInitialized = false;
        function updateNodes() {
            TechTree.nodes.forEach(node => {
                const el = nodeEls.get(node.id);
                const unlocked = TechTree.isUnlocked(node.id);
                if (nodesInitialized && unlocked && !wasUnlocked.get(node.id)) celebrate(el, TechTree.scale(node.id));
                wasUnlocked.set(node.id, unlocked);
                el.classList.toggle('locked', !unlocked);
                el.classList.toggle('affordable', TechTree.canUnlock(node.id));
                // Locked nodes act as buttons so clicking them doesn't also collect star dust.
                if (unlocked) {
                    el.removeAttribute('role');
                } else {
                    el.setAttribute('role', 'button');
                }
                el.querySelector('.world-node-status').textContent = unlocked
                    ? benefitText(node)
                    : 'Locked - ' + StarDust.format(node.unlockCost) + ' Star Dust';
            });
            // A line glows once both ends are unlocked. It turns gold but stays dashed
            // ("ready") when the dependency is unlocked and the node is next in line.
            linkEls.forEach(({ line, nodeId, depId }) => {
                const depUnlocked = TechTree.isUnlocked(depId);
                line.classList.toggle('active', depUnlocked && TechTree.isUnlocked(nodeId));
                line.classList.toggle('ready', depUnlocked && !TechTree.isUnlocked(nodeId));
            });
            nodesInitialized = true;
            renderInfo();
        }

        // Short benefit summary for an object, by type.
        const fmt = StarDust.format;
        function benefitText(node) {
            switch (node.type) {
                case TechTree.TYPES.BASE:
                    return '+' + fmt(node.perClick) + '/click';
                case TechTree.TYPES.GENERATOR:
                    return '+' + fmt(node.perSecond * TechTree.efficiency(node.id)) + '/sec';
                case TechTree.TYPES.EVOLUTION:
                    return '×' + fmt(node.efficiency) + ' efficiency';
                default:
                    return '';
            }
        }

        // Info box: details for the object that was last clicked. Its structure is
        // built once per selection and only text is refreshed afterwards, so the
        // Unlock button isn't replaced under the player's finger while star dust ticks.
        const infoBoxEl = document.getElementById('info-box');
        const infoImageEl = document.getElementById('info-image');
        const infoNameEl = document.getElementById('info-name');
        const infoTypeEl = document.getElementById('info-type');
        const infoDescriptionEl = document.getElementById('info-description');
        const infoDescriptionToggleEl = document.getElementById('info-description-toggle');
        const infoLinesEl = document.getElementById('info-lines');
        const infoUnlockEl = document.getElementById('info-unlock');
        let selectedId = null;
        let shownInfoHtml = null;
        let descriptionOpen = false;

        const escapeHtml = text => text.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
        const percent = fraction => parseFloat((fraction * 100).toFixed(1)) + '%';

        function infoLinesHtml(node) {
            const types = TechTree.TYPES;
            const lines = [];
            if (node.type === types.BASE) {
                lines.push('<p>Benefit: +' + fmt(node.perClick) + ' per click/tap</p>');
            } else if (node.type === types.GENERATOR) {
                const efficiency = TechTree.efficiency(node.id);
                lines.push('<p>Benefit: +' + fmt(node.perSecond * efficiency) + ' per second</p>');
                lines.push('<p class="info-sub">Base rate ' + fmt(node.perSecond) + '/sec × ' + fmt(efficiency) + ' efficiency</p>');
                const evolutions = TechTree.evolutionsOf(node.id);
                if (evolutions.length) {
                    lines.push('<p>Evolutions</p><ul>' + evolutions.map(evo => {
                        const done = TechTree.isUnlocked(evo.id);
                        return '<li class="' + (done ? 'done' : 'locked') + '">' + (done ? '✓ ' : '') +
                            escapeHtml(evo.name) + ' – ×' + fmt(evo.efficiency) + ' efficiency</li>';
                    }).join('') + '</ul>');
                }
            } else if (node.type === types.EVOLUTION) {
                const generator = TechTree.get(node.generator);
                lines.push('<p>Benefit 1: ×' + fmt(node.efficiency) + ' efficiency for ' + escapeHtml(generator.name) + '</p>');
                lines.push('<p>Benefit 2: upgrades your tap by ' + percent(TechTree.generatorShare(node.generator)) +
                    ', the share of all generator production that ' + escapeHtml(generator.name) + ' makes</p>');
            }
            return lines.join('');
        }

        function renderInfo() {
            const node = selectedId && TechTree.get(selectedId);
            infoBoxEl.hidden = !node;
            if (!node) return;
            const hasDescription = !!node.description;
            infoDescriptionToggleEl.hidden = !hasDescription;
            infoDescriptionToggleEl.textContent = (descriptionOpen ? '▾' : '▸') + ' Description (click to ' + (descriptionOpen ? 'hide' : 'show') + ')';
            infoDescriptionEl.hidden = !(hasDescription && descriptionOpen);
            const html = infoLinesHtml(node);
            if (html !== shownInfoHtml) {
                infoLinesEl.innerHTML = html;
                shownInfoHtml = html;
            }
            const unlocked = TechTree.isUnlocked(node.id);
            infoUnlockEl.hidden = unlocked;
            if (unlocked) return;
            const missing = TechTree.missingRequirements(node.id);
            infoUnlockEl.textContent = missing.length
                ? 'Requires ' + missing.map(req => req.name).join(', ')
                : 'Unlock – ' + fmt(node.unlockCost) + ' Star Dust';
            infoUnlockEl.disabled = !TechTree.canUnlock(node.id);
        }

        function selectNode(id) {
            const node = TechTree.get(id);
            // Each newly selected object starts with its description closed; clicking the
            // same unlocked object again (to collect star dust) leaves it as it is.
            if (id !== selectedId) descriptionOpen = false;
            selectedId = id;
            shownInfoHtml = null;
            nodeEls.forEach((el, nodeId) => el.classList.toggle('selected', nodeId === id));
            infoImageEl.src = IMAGE_URLS[id];
            infoNameEl.textContent = node.name;
            infoTypeEl.textContent = node.type;
            infoDescriptionEl.textContent = node.description || '';
            infoTypeEl.className = 'info-type ' + node.type;
            renderInfo();
        }

        function closeInfo() {
            selectedId = null;
            nodeEls.forEach(el => el.classList.remove('selected'));
            renderInfo();
        }

        document.getElementById('info-close').addEventListener('click', closeInfo);
        infoUnlockEl.addEventListener('click', () => { if (selectedId) TechTree.unlock(selectedId); });
        // Clicks in the info box never collect star dust. Clicking the box itself (but
        // not its buttons) opens or closes the description.
        infoBoxEl.addEventListener('click', event => {
            event.stopPropagation();
            if (event.target.closest('button')) return;
            descriptionOpen = !descriptionOpen;
            renderInfo();
        });

        const BASE_PER_CLICK = 1;
        const perClick = () => (BASE_PER_CLICK + TechTree.perClick()) * TechTree.tapMultiplier();
        const amountEl = document.getElementById('star-dust-amount');
        const lifetimeEl = document.getElementById('star-dust-lifetime');
        const perClickEl = document.getElementById('star-dust-per-click');
        const perSecEl = document.getElementById('star-dust-per-sec');
        function updateRates() {
            perClickEl.textContent = '+' + StarDust.format(perClick());
            perSecEl.textContent = StarDust.format(TechTree.perSecond());
        }
        StarDust.onChange(() => {
            amountEl.textContent = StarDust.format(StarDust.balance);
            lifetimeEl.textContent = StarDust.format(StarDust.lifetime);
            updateNodes();
        });
        TechTree.onChange(() => {
            updateRates();
            updateNodes();
        });
        updateRates();

        // Unlocked objects auto-generate star dust.
        const TICK_MS = 200;
        setInterval(() => TechTree.tick(TICK_MS / 1000), TICK_MS);
        // TEMPORARY: test buttons that add Star Dust, for testing only.
        document.querySelectorAll('#test-buttons button').forEach(button => {
            button.addEventListener('click', () => StarDust.add(Number(button.dataset.amount)));
        });
        // TEMPORARY: reset button with a confirm modal, for testing only.
        const resetModal = document.getElementById('reset-modal');
        const closeResetModal = () => { resetModal.hidden = true; };
        document.getElementById('reset-button').addEventListener('click', () => { resetModal.hidden = false; });
        document.getElementById('reset-cancel').addEventListener('click', closeResetModal);
        document.getElementById('reset-confirm').addEventListener('click', () => {
            TechTree.reset();
            StarDust.reset();
            closeResetModal();
        });
        // Clicking the backdrop cancels; clicks in the modal never collect star dust.
        resetModal.addEventListener('click', event => {
            event.stopPropagation();
            if (event.target === resetModal) closeResetModal();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closeResetModal();
                closeInfo();
            }
        });

        // Camera: drag to pan, mouse wheel to zoom. The map always covers the whole
        // viewport, so the camera can never show anything outside the background image.
        let camScale = 1;
        let camX = 0;
        let camY = 0;

        const minScale = () => Math.max(innerWidth / MAP_WIDTH, innerHeight / MAP_HEIGHT);
        const maxScale = () => Math.max(3, minScale() * 3);

        function applyCamera() {
            camScale = Math.min(maxScale(), Math.max(minScale(), camScale));
            camX = Math.min(0, Math.max(innerWidth - MAP_WIDTH * camScale, camX));
            camY = Math.min(0, Math.max(innerHeight - MAP_HEIGHT * camScale, camY));
            mapEl.style.transform = 'translate(' + camX + 'px, ' + camY + 'px) scale(' + camScale + ')';
        }

        // Start centered on the map.
        camScale = 1;
        camX = (innerWidth - MAP_WIDTH * camScale) / 2;
        camY = (innerHeight - MAP_HEIGHT * camScale) / 2;
        applyCamera();
        addEventListener('resize', applyCamera);

        // Zoom keeps the point under the cursor fixed.
        viewportEl.addEventListener('wheel', event => {
            event.preventDefault();
            const lines = event.deltaMode === 1 ? 16 : 1;
            const oldScale = camScale;
            camScale = oldScale * Math.exp(-event.deltaY * lines * 0.0015);
            camScale = Math.min(maxScale(), Math.max(minScale(), camScale));
            const ratio = camScale / oldScale;
            camX = event.clientX - (event.clientX - camX) * ratio;
            camY = event.clientY - (event.clientY - camY) * ratio;
            applyCamera();
        }, { passive: false });

        const DRAG_THRESHOLD = 5;
        let drag = null;
        let justDragged = false;
        viewportEl.addEventListener('pointerdown', event => {
            if (event.button !== 0) return;
            drag = { id: event.pointerId, startX: event.clientX, startY: event.clientY, lastX: event.clientX, lastY: event.clientY, moved: false };
        });
        addEventListener('pointermove', event => {
            if (!drag || event.pointerId !== drag.id) return;
            if (!drag.moved && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < DRAG_THRESHOLD) return;
            drag.moved = true;
            viewportEl.classList.add('dragging');
            camX += event.clientX - drag.lastX;
            camY += event.clientY - drag.lastY;
            drag.lastX = event.clientX;
            drag.lastY = event.clientY;
            applyCamera();
        });
        function endDrag(event) {
            if (!drag || event.pointerId !== drag.id) return;
            // A drag is not a click: swallow the click that follows the release.
            if (drag.moved) {
                justDragged = true;
                setTimeout(() => { justDragged = false; }, 0);
            }
            drag = null;
            viewportEl.classList.remove('dragging');
        }
        addEventListener('pointerup', endDrag);
        addEventListener('pointercancel', endDrag);
        addEventListener('click', event => {
            if (!justDragged) return;
            event.stopPropagation();
            justDragged = false;
        }, true);

        // Shows the amount earned, floating up from where the click happened.
        function showClickPopup(x, y, amount) {
            const popup = document.createElement('div');
            popup.className = 'click-popup';
            popup.textContent = '+' + StarDust.format(amount);
            popup.style.left = x + (Math.random() * 24 - 12) + 'px';
            popup.style.top = y + 'px';
            popup.addEventListener('animationend', () => popup.remove());
            document.body.appendChild(popup);
        }

        // Clicking anywhere that isn't an interactive element also collects star dust.
        document.addEventListener('click', event => {
            if (event.target.closest('button, a, input, select, textarea, label, [role="button"]')) return;
            const amount = perClick();
            StarDust.add(amount);
            showClickPopup(event.clientX, event.clientY, amount);
        });
    </script>
</body>
</html>
